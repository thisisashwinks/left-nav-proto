/* ---------- Toasts (one message per failure in Proposed) ---------- */
function toast(msg, { bad = false, sub = '', icon = null, ms = 4000 } = {}) {
  const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = `${icon ? ic(icon, 16) : bad ? ic('alert', 16) : ''}<span>${esc(msg)}${sub ? ` <span class="sub">${esc(sub)}</span>` : ''}</span>`;
  $('#toasts').append(el);
  after(ms, () => el.remove());
  return el;
}

/* ---------- FailureState ---------- */
function failureHTML(f) {
  return `<div class="failure ${f.small ? 'small' : ''}" role="alert"><div><div class="fi">${ic(f.icon || 'alert', 20)}</div><h3 tabindex="-1">${esc(f.title)}</h3>${f.body ? `<p>${esc(f.body)}</p>` : '<p></p>'}
  <div class="acts">${f.retry ? `<button class="btn pri ${f.small ? 'xs' : 'sm'}" data-r="retry">Try again</button>` : ''}${f.back ? `<button class="btn sec ${f.small ? 'xs' : 'sm'}" data-r="back">Go back</button>` : ''}</div></div></div>`;
}
function wireFailure(L, f) {
  const r = L.querySelector('[data-r="retry"]'), b = L.querySelector('[data-r="back"]');
  if (r) r.onclick = () => f.retry(); if (b) b.onclick = () => f.back();
}

/* ---------- RegionLoader (HLLoadable) — owns grace, min-visible, cross-fade, still, timeout, failure ----------
   o: { parent, skeleton(), render(), mount(L, shown), skAnn, stale, immediate, takeOver, dimOld, timeout,
        onShow, onWords, onStill, onOk(shown), onFail(err, L), failure(err) -> {title, body, retry, back, small},
        onStaleShow, onStaleDone, onStaleFail, log } */
class RegionLoader {
  constructor(r, o) { this.r = r; this.o = o; }
  load(req = {}) {
    const o = this.o, R = this.r;
    this.scope?.dispose();
    const s = this.scope = new Scope(o.parent || ROOT.scope);
    this.t0 = vnow(); this.shownAt = null; this.ended = false;
    R.setAttribute('aria-busy', 'true');
    const cur = topLayer(R), ck = cur?.dataset.kind;
    const show = immediate => {
      if (s.dead || this.ended || this.shownAt != null) return;
      this.shownAt = vnow();
      if (o.stale) o.onStaleShow?.();
      else if (ck === 'skeleton' && o.takeOver) o.log?.('Module took over the shell skeleton (same shape, same phase)');
      else {
        if (o.dimOld && cur && ck === 'content') { cur.classList.add('dim'); cur.inert = true; o.log?.('Old content dimmed to 60% and inert'); }
        setLayer(R, o.skeleton(), { fade: immediate ? 0 : T.FADE, kind: 'skeleton', ann: o.skAnn || 'RegionLoader' });
      }
      o.onShow?.(immediate);
    };
    if (!o.stale && (o.immediate || o.takeOver && ck === 'skeleton' || ck === 'skeleton' || ck === 'failure')) show(true);
    else s.after(T.GRACE, () => show(false));
    s.after(T.WORDS, () => { if (!this.ended) o.onWords?.(); });
    s.after(T.STILL, () => {
      if (this.ended) return;
      if (o.onStill) o.onStill();
      else if (!o.stale) { const L = topLayer(R); if (L && L.dataset.kind === 'skeleton' && !L.querySelector('.sk-still')) L.insertAdjacentHTML('beforeend', '<div class="sk-still">Still working on it</div>'); }
    });
    const arm = ms => s.after(ms, () => { if (this.ended) return; if (Net.offline) { arm(T.TIMEOUT); return; } this._end(s, false, { kind: 'timeout' }); });
    arm(o.timeout ?? T.TIMEOUT);
    Net.request(s, req, d => this._end(s, true, d), e => this._end(s, false, e));
    return s;
  }
  _end(s, ok, data) {
    if (s.dead || this.ended) return; this.ended = true;
    const o = this.o, R = this.r;
    const go = () => {
      if (s.dead) return;
      const shown = this.shownAt != null;
      R.removeAttribute('aria-busy');
      if (ok) {
        if (o.stale) o.onStaleDone?.(data);
        else { const L = setLayer(R, o.render(data), { fade: shown ? T.XF : 0, kind: 'content' }); o.mount?.(L, shown); }
        o.onOk?.(shown, vnow() - this.t0);
      } else if (o.stale) o.onStaleFail?.(data);
      else {
        const f = o.failure(data);
        const L = setLayer(R, failureHTML(f), { fade: shown ? T.XF : 0, kind: 'failure', ann: 'FailureState' });
        wireFailure(L, f); o.onFail?.(data, L);
      }
    };
    const wait = this.shownAt == null ? 0 : Math.max(0, this.shownAt + T.MIN - vnow());
    if (wait > 1) { o.log?.(`Min-visible: holding loader ${Math.round(wait)} ms more`); s.after(wait, go); } else go();
  }
  cancel() { this.ended = true; this.scope?.dispose(); this.r.removeAttribute('aria-busy'); }
}

/* ---------- Route scope + helpers ---------- */
const Route = { scope: null, then: null, busy: false };
function newRouteScope() { Route.scope?.dispose(); Route.scope = new Scope(ROOT.scope); return Route.scope; }
function runThen() { const f = Route.then; Route.then = null; if (f) after(250, f); }
const shapeHTML = P => SHAPES[P.shape]();
const moduleSpinner = (ann = 'Module spinner (hr-spin 34 px)') => `<div class="center-fill" data-ann="${ann}" style="position:relative"><div class="hr-spin"></div></div>`;
const TODAY_ANN = { heavy: 'Module skeleton · heavy gray blocks, pulse 2 s', pulse: 'Module skeleton · animate-pulse 2 s', wave: 'Module skeleton · wave-lines 2 s', hr: 'Module skeleton · hr-skeleton 2 s', ring: 'Legacy lds-ring “Initializing…”', spin: 'Module spinner (hr-spin 34 px)' };
function todaySkeleton(P) {
  switch (P.today) {
    case 'heavy': return `<div class="v-today v-heavy" style="padding:72px 24px 24px;display:grid;grid-template-columns:1fr 2fr;gap:16px;align-items:start"><div class="skc" style="gap:8px">${[0, 1, 2, 3, 4].map(() => sk.block('100%', 30, 'border-radius:0')).join('')}</div><div class="skc" style="gap:8px">${[0, 1, 2, 3, 4, 5].map(() => sk.block('100%', 62, 'border-radius:0')).join('')}</div></div>`;
    case 'ring': return `<div class="center-fill"><div class="stack"><div class="lds-ring"></div>Initializing…</div></div>`;
    case 'spin': return `<div class="center-fill"><div class="hr-spin"></div></div>`;
    default: return `<div class="v-today v-${P.today}" style="min-height:100%">${shapeHTML(P)}</div>`;
  }
}
function setShellChrome(P) { S.page = Object.keys(PAGES).find(k => PAGES[k] === P) || S.page; renderCrumbs(P); applyFullBleed(P); renderNav(false); renderBarRight(false); }
function closeOverlays() { closeFlyout(); closeDrawer(); }

/* ---------- PROPOSED route change ---------- */
function navigate(id, opts = {}) {
  const P = PAGES[id];
  if (!P) { if (!EMBED.on) toast('That page isn’t part of this playground.'); return; }
  closeOverlays(); closeModal(true);
  if (isToday()) return navigateToday(id, opts);
  const prev = opts.prev ?? S.page;
  const s = newRouteScope(); Route.then = opts.then || null;
  S.page = id;
  const op = TL.start(`Route → ${P.title}`); logOp(`Route → ${P.title} · ${netLabel()}`);
  renderCrumbs(P); applyFullBleed(P); renderNav(false); renderBarRight(false);
  log('Breadcrumb + nav selection updated instantly');
  Words.clear(); Line.reset();
  const loader = new RegionLoader(region(), {
    parent: s, dimOld: true, skAnn: 'ShellSkeleton', log,
    skeleton: () => shapeHTML(P), render: () => P.render(),
    mount: (L, shown) => P.mount?.(L, s, shown),
    onShow: imm => { Line.start(); log(imm ? `ShellSkeleton (${P.shape}) shown at once — previous view was a loader` : `ShellSkeleton (${P.shape}) faded in`); log('RouteProgressLine shown'); TL.set(op, 'indicator'); announce(`Loading ${P.title}`); },
    onWords: () => { if (Net.offline) return; Words.set(`Loading ${P.title}…`); log(`StatusWords: Loading ${P.title}…`); TL.set(op, 'words'); },
    onStill: () => { if (Net.offline) return; Words.set('Still working on it · Your connection may be slow'); log('StatusWords: Still working on it'); TL.set(op, 'still'); },
    onOk: (shown, ms) => {
      Line.done(); Words.clear(); TL.end(op, 'done');
      if (shown) { log('Content cross-faded (200 ms)', 'good'); log('RouteProgressLine completed, fading'); announce(`${P.title} loaded`); }
      else log(`Content ready in ${Math.round(ms)} ms — under 300 ms, no loader shown`, 'good');
      runThen();
    },
    failure: err => ({ title: `Couldn't load ${P.title}`, body: 'Check your connection and try again.', retry: () => navigate(id, { prev }), back: prev && prev !== id ? () => navigate(prev) : null, icon: err.kind === 'offline' ? 'wifi-off' : 'alert' }),
    onFail: (err, L) => {
      Line.stop(); Words.clear(); TL.end(op, 'failed');
      log(err.kind === 'timeout' ? 'Timeout at 30 s → FailureState in canvas' : 'Request failed → FailureState in canvas', 'bad');
      announce(`Couldn't load ${P.title}`);
      const h = L.querySelector('h3'); if (h) h.focus({ preventScroll: true });
    },
  });
  loader.load({ forceOk: !!P.frameCached });
}

/* ---------- TODAY route change (reproduces S5, S6, S8, S9, S10, S11) ---------- */
function navigateToday(id, opts = {}) {
  const P = PAGES[id];
  const s = newRouteScope(); Route.then = opts.then || null;
  const op = TL.start(`Route → ${P.title} (today)`); logOp(`Route → ${P.title} · ${netLabel()}`);
  log('Old page and old breadcrumb kept', 'today');
  Words.clear(); Line.reset();
  if (opts.pendingNav) $$(`#nav [data-page="${id}"]`).forEach(b => b.classList.add('on'));
  const lat = Net.latency(P.frameCached ? {} : {});
  let mounted = false, done = false;
  const mount = () => { if (mounted) return; mounted = true; setShellChrome(P); log('Module mounted — breadcrumb changes only now', 'today'); };
  const words = opts.words || `Loading ${P.title}…`;
  s.after(T.TODAY_BAR, () => { if (done) return; Line.start(); log('Route bar shown after 150 ms', 'today'); TL.set(op, 'indicator'); });
  s.after(T.WORDS, () => { if (done) return; Words.set(words); log(`Words: ${words}`, 'today'); TL.set(op, 'words'); });
  s.after(T.STILL, () => { if (done) return; Words.set('Still working on it · Your connection may be slow'); log('Words: Still working on it', 'today'); TL.set(op, 'still'); });
  /* S9: routing away from a stuck page keeps the old page + old breadcrumb much longer */
  const mountAt = opts.holdOld ? (isFinite(lat) ? lat * 0.6 : 12000) : Math.min(isFinite(lat) ? lat * 0.35 : 1200, 1200);
  s.after(mountAt, () => {
    if (done) return; mount();
    setLayer(region(), todaySkeleton(P), { kind: 'skeleton', ann: TODAY_ANN[P.today] });
    log(TODAY_ANN[P.today], 'today');
    /* The shell skeleton stays while the request runs; the module swaps it for its own spinner shortly before data lands.
       On a hang the skeleton stays until the 30 s silent give-up reveals the spinner (S8). */
    const handAt = isFinite(lat) ? lat - mountAt - 1500 : Infinity;
    if (P.todaySpinner && isFinite(handAt) && handAt > 400) s.after(handAt, () => { if (done) return; setLayer(region(), moduleSpinner(), { kind: 'skeleton' }); log('Skeleton → centered spinner handoff', 'today'); });
  });
  Net.request(s, { forceOk: !!P.frameCached }, () => {
    if (done) return; done = true; mount();
    const L = setLayer(region(), P.render(), { kind: 'content' }); P.mount?.(L, s, false);
    Line.done(); Words.clear(); TL.end(op, 'done'); log('Content popped in — no cross-fade, no minimum visible time', 'today'); runThen();
  }, () => {
    if (done) return; done = true; mount();
    if (topLayer(region())?.dataset.kind !== 'skeleton') setLayer(region(), moduleSpinner(), { kind: 'skeleton' });
    toast('Something went wrong', { bad: true }); toast('Request failed with status code 503', { bad: true });
    Line.done(); Words.clear(); TL.end(op, 'failed'); log('Two error toasts; the loader never exits', 'today');
  });
  s.after(T.TIMEOUT, () => {
    if (done) return; done = true; mount();
    Words.clear(); Line.reset();
    setLayer(region(), moduleSpinner('Module spinner — spins forever'), { kind: 'skeleton' });
    TL.end(op, 'failed'); log('30 s: shell gave up silently — infinite spinner revealed, no error, no Try again', 'today');
  });
}

/* ---------- Cold boot ---------- */
function coldBoot() {
  resetAll();
  if (PAGES[S.page].full) S.page = 'workflows';
  const P = PAGES[S.page];
  const s = newRouteScope();
  const today = isToday();
  const op = TL.start('Cold boot'); logOp(`Cold boot → ${P.title} · ${netLabel()}`);
  const app = $('#app'), blank = $('#blank');
  blank.style.display = 'block';
  ['#rail', '#nav', '#bar-right'].forEach(q => $(q).classList.toggle('v-today', today));
  ['#rail', '#nav', '#bar-right'].forEach(q => $(q).classList.toggle('v-shell', today));
  renderShell(true); renderCrumbs(null); applyFullBleed(P);
  setLayer(region(), today ? '' : shapeHTML(P), { kind: 'skeleton', ann: 'ShellSkeleton' });
  let shellReady = false, finished = false;
  if (today) s.after(1200, () => { if (!shellReady && !finished) { setLayer(region(), `<div class="v-today v-shell" style="min-height:100%">${shapeHTML(P)}</div>`, { kind: 'skeleton', ann: 'ShellSkeleton' }); log('Route-shaped canvas skeleton arrives after an empty canvas', 'today'); } });
  const shownAt = vnow() + 60;
  s.after(60, () => {
    blank.style.display = 'none'; syncGlow();
    log('Host document painted ShellSkeleton (rail, nav, top bar, route-shaped canvas)');
    Words.set('Loading your account'); log('StatusWords: Loading your account'); TL.set(op, 'indicator');
    announce('Loading your account');
    if (today) { BootBar.start(); log('Full-window boot bar with fake staged progress (.06 → .28 → .46 → .78)', 'today'); }
  });
  s.after(T.BOOT_STALL, () => {
    if (shellReady || finished) return;
    Words.set('Still connecting… Reload the page if this continues.', { spin: false, icon: 'alert', wrap: true, action: { act: 'boot-retry', label: 'Try again' } });
    log('Boot stall at 10 s: Still connecting… + Try again'); TL.set(op, 'still');
  });
  const bootFail = (err) => {
    if (finished) return; finished = true;
    Words.clear(); TL.end(op, 'failed');
    if (today) {
      BootBar.hide(); shellReady = true; renderShell(false); renderCrumbs(P); clearShellVariant();
      setLayer(region(), moduleSpinner('Module spinner — spins forever'), { kind: 'skeleton' });
      if (err) { toast('Something went wrong', { bad: true }); toast('Network Error', { bad: true }); }
      log(err ? 'Boot failed: two toasts, spinner forever' : '30 s: gave up silently — infinite spinner revealed', 'today');
      return;
    }
    const f = { title: "Couldn't load your account", body: 'Check your connection and try again.', retry: () => coldBoot() };
    const L = setLayer(region(), failureHTML(f), { fade: T.XF, kind: 'failure', ann: 'FailureState' }); wireFailure(L, f);
    log(err ? 'Boot request failed → FailureState' : 'Boot timeout at 30 s → FailureState', 'bad'); announce("Couldn't load your account");
  };
  s.after(T.TIMEOUT, () => { if (!finished && !shellReady) bootFail(null); });
  Net.request(s, {}, () => {
    const wait = today ? 0 : Math.max(0, shownAt + T.MIN - vnow());
    s.after(wait, () => {
      if (finished) return;
      shellReady = true; clearShellVariant(); renderShell(false); renderCrumbs(P);
      ['#rail', '#nav', '#bar-right'].forEach(q => { const e = $(q); e.classList.remove('shell-in'); void e.offsetWidth; if (!today) e.classList.add('shell-in'); });
      log(today ? 'Shell chrome rendered' : 'Shell chrome cross-faded in');
      if (today) {
        Words.set('Loading page…'); log('Module mounts its own skeleton (different look from the shell)', 'today');
        setLayer(region(), todaySkeleton(P), { kind: 'skeleton', ann: TODAY_ANN[P.today] });
        s.after(T.TODAY_BAR, () => { if (!finished) { Line.start(); log('Second progress bar appears under the header — two bars at once', 'today'); } });
        const lat = Net.latency({ factor: 0.6 });
        if (P.todaySpinner) s.after(Math.min(lat * 0.5, 1500), () => { if (!finished) { setLayer(region(), moduleSpinner(), { kind: 'skeleton' }); log('Skeleton → centered spinner handoff', 'today'); } });
        Net.request(s, { factor: 0.6 }, () => {
          if (finished) return; finished = true;
          const L = setLayer(region(), P.render(), { kind: 'content' }); P.mount?.(L, s, false);
          BootBar.done(); Line.done(); Words.clear(); TL.end(op, 'done'); log('Content popped in', 'today'); S.booted = true; runThen();
        }, () => bootFail(true));
        return;
      }
      Words.set('Loading your account');
      const loader = new RegionLoader(region(), {
        parent: s, takeOver: true, log, skAnn: 'ShellSkeleton', skeleton: () => shapeHTML(P), render: () => P.render(),
        mount: (L, shown) => P.mount?.(L, s, shown),
        onShow: () => { },
        onStill: () => { },
        onOk: () => { finished = true; Words.clear(); TL.end(op, 'done'); log('Content cross-faded (200 ms)', 'good'); announce(`${P.title} loaded`); S.booted = true; runThen(); },
        failure: () => ({ title: `Couldn't load ${P.title}`, body: 'Check your connection and try again.', retry: () => navigate(S.page) }),
        onFail: () => { finished = true; Words.clear(); TL.end(op, 'failed'); log('Page request failed → FailureState', 'bad'); },
      });
      loader.load({ factor: 0.5, forceOk: !!P.frameCached });
    });
  }, () => bootFail(true));
}
function clearShellVariant() { ['#rail', '#nav', '#bar-right'].forEach(q => $(q).classList.remove('v-today', 'v-shell')); }

/* ---------- Account switch ---------- */
function switchAccount(i) {
  if (i === S.acct) return;
  closeOverlays(); closeModal(true);
  const prevAcct = S.acct, name = ACCOUNTS[i][1], P = PAGES[S.page];
  const s = newRouteScope();
  S.acct = i;
  const op = TL.start(`Account → ${name}`); logOp(`Switch account → ${name} · ${netLabel()}`);
  Words.clear(); Line.reset();
  renderRail(false);
  const navEl = $('#nav');
  navEl.classList.toggle('v-today', isToday()); navEl.classList.toggle('v-shell', isToday());
  renderNav(true); navEl.querySelector('.nav-head').innerHTML = `<b>${esc(name)}</b><button title="Collapse">${ic('panel-left', 16)}</button>`;
  log('Account name + avatar updated instantly');
  log('Nav rows → skeleton');
  let navDone = false;
  const navReady = () => { if (navDone) return; navDone = true; navEl.classList.remove('v-today', 'v-shell'); renderNav(false); navEl.classList.remove('shell-in'); void navEl.offsetWidth; if (!isToday()) navEl.classList.add('shell-in'); log('Nav rows loaded'); };
  if (isToday()) {
    log('Content still shows the previous account’s data', 'today');
    let done = false, contentDone = false;
    const lat = Net.latency({ factor: 0.7 });
    s.after(Math.min(isFinite(lat) ? lat * 0.5 : 1200, 1200), () => { if (contentDone) return; setLayer(region(), todaySkeleton(P), { kind: 'skeleton', ann: TODAY_ANN[P.today] }); log('Content re-skeletoned with the module skeleton', 'today'); });
    s.after(T.TODAY_BAR, () => { if (!done) { Line.start(); TL.set(op, 'indicator'); } });
    s.after(T.WORDS, () => { if (!done) { Words.set('Loading page…'); TL.set(op, 'words'); } });
    s.after(T.STILL, () => { if (!done) { Words.set('Still working on it · Your connection may be slow'); TL.set(op, 'still'); } });
    Net.request(s, { factor: 0.7 }, () => { contentDone = true; const L = setLayer(region(), P.render(), { kind: 'content' }); P.mount?.(L, s, false); log('Content reloaded before the nav', 'today'); }, () => { contentDone = true; toast('Something went wrong', { bad: true }); toast('Something went wrong', { bad: true }); });
    Net.request(s, { factor: 2 }, () => { done = true; navReady(); Line.done(); Words.clear(); TL.end(op, 'done'); }, () => { done = true; Line.done(); Words.clear(); TL.end(op, 'failed'); });
    s.after(T.TIMEOUT, () => { if (!done) { done = true; Words.clear(); Line.reset(); TL.end(op, 'failed'); log('30 s: gave up silently; nav stays skeleton', 'today'); } });
    return;
  }
  const t0 = vnow();
  s.after(T.GRACE, () => { if (!loader.ended) { Line.start(); Words.set(`Switching to ${name}`); log(`RouteProgressLine + StatusWords: Switching to ${name}`); TL.set(op, 'indicator'); announce(`Switching to ${name}`); } });
  Net.request(s, { failThis: false }, () => s.after(Math.max(0, t0 + T.MIN - vnow()), navReady), () => navReady());
  const loader = new RegionLoader(region(), {
    parent: s, immediate: true, log, skAnn: 'ShellSkeleton', skeleton: () => shapeHTML(P), render: () => P.render(),
    mount: (L, shown) => P.mount?.(L, s, shown),
    onShow: () => log('Previous account’s content replaced by skeleton at once'),
    onStill: () => { Words.set('Still working on it · Your connection may be slow'); TL.set(op, 'still'); },
    onOk: () => { navReady(); Line.done(); Words.clear(); TL.end(op, 'done'); log('Content cross-faded', 'good'); announce(`${name} loaded`); },
    failure: () => ({ title: `Couldn't switch to ${name}`, body: 'Check your connection and try again.', retry: () => { S.acct = prevAcct; switchAccount(i); }, back: () => { S.acct = i; switchAccount(prevAcct); } }),
    onFail: (e) => { navReady(); Line.stop(); Words.clear(); TL.end(op, 'failed'); log(e.kind === 'timeout' ? 'Timeout at 30 s → FailureState' : 'Failed → FailureState', 'bad'); },
  });
  loader.load({ factor: 1.2, forceOk: !!P.frameCached });
}

/* Dashboard: every widget is an independent RegionLoader; partial failure is per card */
const Dash = { loaders: {}, results: {}, req: {} };
function mountDashboard(L, s, shown) {

  Dash.loaders = {}; Dash.results = {}; Dash.req = {};
  const settle = () => {

/* Contacts: RefreshState. Refresh (same list, new data) and Filter (another list) each have variants set in the panel:
   refresh  line → stale rows stay, data swaps in place      rows → skeleton rows inserted at the top for new rows (+ changed older rows)
   filter   stale → stale rows stay until the new list lands  skeleton → every body row becomes a skeleton (header stays real)
   bar      2 px edge line on the table on/off (both). Refresh ↔ Cancel after 2 s; failure restores the last rows. */
const Refresh = { loader: null, cancel: null, scope: null, restore: null };
const refreshBtn = () => `<button class="tb-btn" data-act="refresh">${ic('refresh')}Refresh</button>`;
const ADD_N = 5, CHANGED_AT = [3, 7];   /* CHANGED_AT: positions among the older rows that change on refresh */
function nextRefreshData() {
  const cur = allContacts(), k = (S.added || 0);
  const add = Array.from({ length: ADD_N }, (_, i) => NEW_CONTACTS[(k + i) % NEW_CONTACTS.length].slice());
  const older = (S.rows || []).map(r => r.slice());
  if (S.tbl.changed) CHANGED_AT.forEach(j => { const r = older[j]; if (r) { r[4] = r[4] ? 0 : 1; if (!r[3]) r[3] = r[0].toLowerCase().replace(/[^a-z]+/g, '.') + '@mail.com'; } });
  return { rows: [...add, ...older], added: ADD_N, changed: S.tbl.changed ? CHANGED_AT.map(j => j + ADD_N).filter(j => j < 16) : [], cur };
}
function refreshContacts(tabIdx) {
  const reg = $('#contacts-table'); if (!reg) return;
  const isFilter = tabIdx != null;
  const snap = { rows: S.rows ? S.rows.map(r => r.slice()) : null, added: S.added || 0, from: S.ctab || 0, to: tabIdx };
  if (isFilter) S.lastFilter = snap; else S.lastRefresh = snap;
  if (isFilter) { S.ctab = tabIdx; $$('.vtab[data-act="smart-tab"]').forEach((t, i) => t.classList.toggle('on', i === tabIdx)); }
  $('#refresh-msg').innerHTML = '';
  const label = isFilter ? `Filter → ${SMART_TABS[tabIdx][0]}` : 'Refresh contacts';
  const op = TL.start(label); logOp(`${label} · ${netLabel()}`);
  const parent = Route.scope || ROOT.scope;
  if (isToday()) {
    Refresh.scope?.dispose(); const rs = Refresh.scope = new Scope(parent);
    const data = isFilter || S.ctab ? null : nextRefreshData();
    setLayer(reg, `<div class="v-today v-wave"><div class="tbl-scroll"><table class="t"><thead><tr><th class="cb"><span class="cbx"></span></th><th>Name</th><th>Email</th><th>Created</th><th>Last activity</th><th>Status</th><th></th></tr></thead></table>${sk.tableRows(11)}</div></div>`, { kind: 'skeleton', ann: 'Re-skeleton · wave-lines 2 s' });
    log('Loaded rows thrown away → table re-skeletoned', 'today'); TL.set(op, 'indicator');
    Net.request(rs, {}, () => { if (data) { S.rows = data.rows; S.added = (S.added || 0) + data.added; } setLayer(reg, contactsTable(S.ctab)); TL.end(op, 'done'); log('Rows popped in', 'today'); }, () => { toast('Something went wrong', { bad: true }); toast('Failed to fetch contacts', { bad: true }); TL.end(op, 'failed'); });
    return;
  }
  Refresh.loader?.cancel(); Refresh.restore?.();
  const V = S.tbl, style = isFilter ? V.filter : V.refresh;
  const upd = $('#updated'), slot = $('#refresh-slot'), prevUpd = upd.textContent;
  const data = isFilter || S.ctab ? null : nextRefreshData();   /* new contacts land in All; other lists refresh in place */
  const L0 = topLayer(reg), snapshot = L0 ? L0.innerHTML : null;
  let edge = null, touched = false;
  const restore = Refresh.restore = () => { edge?.remove(); edge = null; slot.innerHTML = refreshBtn(); };
  const putBack = () => { if (touched && snapshot != null) { const L = topLayer(reg); if (L) L.innerHTML = snapshot; touched = false; } };
  const skeletonize = () => {
    const tb = topLayer(reg)?.querySelector('tbody'); if (!tb) return;
    touched = true;
    if (isFilter && style === 'skeleton') {
      const n = Math.max(6, tb.rows.length);
      tb.innerHTML = Array.from({ length: n }, (_, i) => skTr(i, false)).join('');
      log(`Filter: all ${n} body rows → skeleton (header stays real)`);
    } else if (data && style === 'rows') {
      tb.insertAdjacentHTML('afterbegin', Array.from({ length: data.added }, (_, i) => skTr(i, true)).join(''));
      while (tb.rows.length > 16) tb.deleteRow(tb.rows.length - 1);
      data.changed.forEach((j, i) => { const r = tb.rows[j]; if (r) r.outerHTML = skTr(j + i, true); });
      log(`Refresh: ${data.added} skeleton rows at the top for new contacts${data.changed.length ? ` + ${data.changed.length} changed rows below` : ' — older rows untouched'}`);
    }
    syncGlow();
  };
  const ld = Refresh.loader = new RegionLoader(reg, {
    parent, stale: true, log,
    onStaleShow: () => {
      if (V.bar) { reg.insertAdjacentHTML('beforeend', '<div class="edge-line" data-ann="RefreshState"><i></i></div>'); edge = reg.lastElementChild; }
      skeletonize();
      upd.textContent = 'Updating…';
      if (style === 'line' || style === 'stale') log(`RefreshState: stale rows stay at 100%${V.bar ? ' + 2 px edge line' : ' · no bar (Updating… only)'}`);
      else log(V.bar ? 'Edge line on the table' : 'No bar — skeleton rows only');
      TL.set(op, 'indicator'); announce(isFilter ? 'Filtering contacts' : 'Updating contacts');
    },
    onWords: () => { slot.innerHTML = `<button class="tb-btn" data-act="refresh-cancel">${ic('x')}Cancel</button>`; log('Refresh → Cancel after 2 s'); TL.set(op, 'words'); },
    onStill: () => { upd.textContent = 'Still working on it'; TL.set(op, 'still'); log('Still working on it'); },
    onStaleDone: () => {
      let fresh = [];
      if (data) { S.rows = data.rows; S.added = (S.added || 0) + data.added; fresh = [...Array(data.added).keys(), ...data.changed]; }
      const L = topLayer(reg); if (L) L.innerHTML = contactsTable(S.ctab, fresh); touched = false;
      restore(); S.updated = wallTime(); upd.textContent = 'Updated ' + S.updated;
      log(data ? `${data.added} new rows at the top${data.changed.length ? `, ${data.changed.length} older rows updated` : ''} · “Updated ${S.updated}”` : `Filtered rows in place · “Updated ${S.updated}”`, 'good');
      TL.end(op, 'done'); announce(isFilter ? 'Contacts filtered' : 'Contacts updated');
    },
    onStaleFail: (e) => {
      putBack(); restore(); upd.textContent = prevUpd;
      $('#refresh-msg').innerHTML = `<div class="inline-err" style="margin:-4px 0 10px">${ic('alert', 14)}Couldn't update contacts. Showing your last results. <button class="tb-btn" style="height:26px;font-size:12px" data-act="refresh">Try again</button></div>`;
      log(e.kind === 'timeout' ? 'Timeout at 30 s — last rows restored, inline message' : 'Refresh failed — last rows restored, inline message', 'bad'); TL.end(op, 'failed');
    },
  });
  Refresh.cancel = () => { ld.cancel(); putBack(); restore(); upd.textContent = prevUpd; log('Canceled — kept the last results'); TL.end(op, 'done'); };
  ld.load({});
}

/* ButtonLoading: idle → pending (spinner after 300 ms, width locked, aria-disabled) → success (1.5 s) | inline error; > 5 s → job */
const Btn = { abort: null };
function buttonLoad(btn, o) {
  if (btn.dataset.busy) return;
  const s = new Scope(o.parent || Route.scope || ROOT.scope);
  const op = TL.start(o.opLabel); logOp(`${o.opLabel} · ${netLabel()}`);
  const labelEl = btn.querySelector('.bl-label'), orig = labelEl.innerHTML;
  o.errHost?.querySelector('.inline-err')?.remove();
  btn.dataset.busy = '1'; btn.setAttribute('aria-disabled', 'true');
  let shownAt = null, ended = false, job = null;
  Btn.abort = () => { s.dispose(); if (job) Jobs.remove(job); resetBtn(); o.errHost?.querySelector('.inline-err')?.remove(); Btn.abort = null; };
  const resetBtn = () => { btn.classList.remove('pending', 'ok', 'busy-lbl'); btn.style.transition = ''; btn.querySelector('.bl-spin')?.remove(); labelEl.innerHTML = orig; btn.style.width = ''; btn.removeAttribute('aria-disabled'); delete btn.dataset.busy; delete btn.dataset.ann; };
  if (isToday()) {
    labelEl.innerHTML = '<span class="lds-ring" style="width:14px;height:14px;border-width:2px;border-color:#fff transparent transparent transparent"></span>';
    log('Label swapped for a spinner at once — button width jumps', 'today'); TL.set(op, 'indicator');
    Net.request(s, {}, () => { resetBtn(); toast(o.todayOk || 'Updated successfully!', { icon: 'check' }); TL.end(op, 'done'); o.onDone?.(); },
      () => { resetBtn(); toast('Something went wrong', { bad: true }); toast('Error 503: Bad Gateway', { bad: true }); TL.end(op, 'failed'); log('Two toasts; nothing near the button', 'today'); });
    return;
  }
  btn.style.width = btn.offsetWidth + 'px'; btn.dataset.ann = 'ButtonLoading';
  s.after(T.GRACE, () => {
    if (ended || job) return; shownAt = vnow();
    if (S.btnLabel) {
      /* Spinner + words: width grows once to fit the label, then holds */
      const w0 = btn.offsetWidth; btn.classList.add('busy-lbl');
      labelEl.innerHTML = `${spinner(14)}${esc(o.busyLabel || 'Saving…')}`;
      btn.style.width = 'auto'; const w1 = Math.max(w0, btn.offsetWidth); btn.style.width = w0 + 'px'; void btn.offsetWidth;
      btn.style.transition = `width ${Math.round(150 / Clock.scale)}ms ease-out`; btn.style.width = w1 + 'px';
      log(`ButtonLoading: spinner + “${o.busyLabel || 'Saving…'}” after 300 ms, aria-disabled`);
    } else { btn.classList.add('pending'); btn.insertAdjacentHTML('beforeend', `<span class="bl-spin">${spinner(16)}</span>`); log('ButtonLoading: spinner after 300 ms, width locked, aria-disabled'); }
    TL.set(op, 'indicator');
  });
  s.after(5000, () => {
    if (ended) return;
    job = Jobs.add({ title: o.jobName, icon: 'refresh', indeterminate: true, note: 'You can keep working. We’ll let you know when it’s saved.' });
    resetBtn(); log('> 5 s: action became a background job (JobTray)'); TL.set(op, 'words');
    toast(o.jobName + '…', { sub: 'You can keep working.' });
  });
  s.after(T.STILL, () => { if (job && !ended) Jobs.update(job, { note: 'Still working on it' }); });
  s.after(T.TIMEOUT, () => finish(false, { kind: 'timeout' }));
  Net.request(s, {}, () => finish(true), e => finish(false, e));
  function finish(ok, err) {
    if (ended) return; ended = true;
    if (job) {
      if (ok) { Jobs.update(job, { state: 'done', title: o.jobDone, note: '', indeterminate: false }); toast(o.jobDone, { icon: 'check' }); log('Job finished', 'good'); TL.end(op, 'done'); o.onDone?.(); }
      else { Jobs.update(job, { state: 'failed', title: o.jobFail, note: 'Check your connection and try again.', indeterminate: false, acts: [['Try again', () => { Jobs.remove(job); btn.click(); }, 1], ['Dismiss', () => Jobs.remove(job)]] }); log('Job failed → Try again in the tray', 'bad'); TL.end(op, 'failed'); }
      return;
    }
    const wait = shownAt == null ? 0 : Math.max(0, shownAt + T.MIN - vnow());
    s.after(wait, () => {
      if (ok) {
        btn.querySelector('.bl-spin')?.remove(); btn.classList.remove('pending', 'busy-lbl'); btn.classList.add('ok');
        labelEl.innerHTML = `${ic('check', 14)}${o.okLabel || 'Saved'}`;
        log('Success: check + “Saved” held 1.5 s', 'good'); announce('Saved'); TL.end(op, 'done');
        s.after(T.BTN_OK, () => { resetBtn(); o.onDone?.(); });
      } else {
        resetBtn();
        o.errHost?.insertAdjacentHTML('beforeend', `<div class="inline-err" role="alert">${ic('alert', 14)}${esc(o.errText)}</div>`);
        log(`${err && err.kind === 'timeout' ? 'Timeout' : 'Error'}: inline message below the button — no shake, no toast`, 'bad'); announce(o.errText); TL.end(op, 'failed');
      }
    });
  }
}

/* JobTray — shell-owned, bottom-right, survives route changes */
const IMPORT_NOTE = 'You can keep working. We’ll notify you when it’s done.';
const Jobs = {
  list: [], seq: 0, collapsed: false,
  add(j) { j.id = ++this.seq; j.started = wallTime(); j.state = j.state || 'running'; j.acts = j.acts || []; this.list.unshift(j); this.collapsed = false; this.render(); return j; },
  update(j, p) { Object.assign(j, p); this.render(); },
  remove(j) { j.scope?.dispose(); this.list = this.list.filter(x => x !== j); this.render(); },
  bar(j, pct, cls = '') { return j.state === 'running' ? (j.indeterminate ? `<div class="pbar ind" role="progressbar" aria-label="${esc(j.title)}"><i></i></div>` : `<div class="pbar ${cls}" role="progressbar" aria-label="${esc(j.title)}" aria-valuemin="0" aria-valuemax="${j.total}" aria-valuenow="${Math.round(j.done)}"><i style="width:${pct.toFixed(1)}%"></i></div>`) : j.total ? `<div class="pbar ${j.state === 'done' ? 'done' : 'err'}"><i style="width:${pct.toFixed(1)}%"></i></div>` : ''; },
  row(j) {
    if (j.files) return this.filesRow(j);
    const ico = j.state === 'done' ? `<span class="ji ok">${ic('check', 14)}</span>` : j.state === 'failed' ? `<span class="ji err">${ic('alert', 14)}</span>` : `<span class="ji">${j.indeterminate ? spinner(16) : ic(j.icon || 'upload', 14)}</span>`;
    const pct = j.total ? Math.min(100, j.done / j.total * 100) : 0;
    const inlineX = j.state === 'running' && j.inlineCancel != null ? `<button class="jx" data-act="job" data-j="${j.id}" data-a="${j.inlineCancel}" title="Cancel import" aria-label="Cancel import">${ic('x', 14)}</button>` : '';
    const bar = this.bar(j, pct), barRow = bar ? (inlineX ? `<div class="jbar">${bar}${inlineX}</div>` : bar) : '';

    toast(t, { sub: note, icon: bad ? 'alert' : 'check' }); announce(t);

      case 'cancel': f.state = 'canceled'; log(`${f.name} canceled · ${fmt(Math.round(f.done / 10) * 10)} kept`, '', op); break;
      case 'retry': f.state = 'running'; f.noFail = true; log(`${f.name}: Retry`, '', op); break;

    const fz = files.find(x => x.id === failId);

    else if (isFinite(stepMs)) s.after(stepMs * 4, () => { host.innerHTML = ''; WF_AI.forEach(n => lastConn().insertAdjacentHTML('beforebegin', realNode(n))); TL.end(op, 'done'); log('All nodes appeared at once', 'today'); });
    return;
  }
  let step = 0, phase = 'working', secs = 0; const t0 = vnow();
  const paint = () => {
    const working = phase === 'working';
    const li = (i, t) => { const cls = i < step || phase === 'done' ? 'done' : i === step && working ? '' : 'wait'; return `<li class="${cls}"><span class="st">${cls === 'done' ? ic('check', 14) : cls === 'wait' ? '<i></i>' : spinner(16)}</span>${t}</li>`; };
    let head;
    if (working) head = `<div class="ai-status ${step === 0 ? 'thinking' : ''}"><span class="spark">${ic('sparkles', 12)}</span><b>Building your workflow</b><span class="tmr"></span></div><div class="note" style="font-size:12px;color:#667085"></div>`;
    else if (phase === 'done') head = `<div class="ai-status"><span class="spark">${ic('sparkles', 12)}</span><b>Built in ${secs}s</b><span>· 3 actions added</span></div>`;
    else if (phase === 'stopped') head = `<div class="ai-status"><span class="spark" style="background:#98a2b3">${ic('sparkles', 12)}</span><b>Stopped</b></div>`;
    else head = `<div class="ai-status"><span class="spark" style="background:#d92d20">${ic('alert', 12)}</span><b>Couldn't generate this workflow</b></div><div style="font-size:12px;color:#475467;margin-top:2px">Check your connection and try again.</div>`;
    const acts = working ? `<button class="btn sec xs" data-act="wf-stop">${ic('stop', 12)}Stop</button>` : phase === 'done' ? `<button class="btn pri xs" data-act="wf-keep">Keep</button><button class="btn sec xs" data-act="wf-undo">Undo</button>` : `<button class="btn ${phase === 'failed' ? 'pri' : 'sec'} xs" data-act="ai-workflow">${phase === 'failed' ? 'Try again' : 'Regenerate'}</button><button class="btn sec xs" data-act="wf-undo">Discard</button>`;
    host.innerHTML = `<div class="ledger" data-ann="AIStatus · step ledger" role="status">${head}<ul class="ai-steps">${STEPS.map((t, i) => li(i, t)).join('')}</ul><div class="ai-acts">${acts}</div></div>`;
  };
  s.frame(() => { const t = $('.ledger .tmr'); if (t) { const e = vnow() - t0; t.textContent = e >= 2000 ? ` · ${Math.floor(e / 1000)}s` : ''; const n = $('.ledger .note'); if (n) n.textContent = aiNotes(e); } });
  const addSkeletonNodes = () => { WF_AI.forEach((n, i) => lastConn().insertAdjacentHTML('beforebegin', `<div class="conn ai-node"></div><div class="node ai-node region" data-n="${i}" style="display:grid"><div class="layer" data-kind="skeleton" data-ann="Output-shaped skeleton"><div class="skr">${sk.block(32, 32)}<div class="skc" style="flex:1">${sk.line('50%', 12)}${sk.line('70%', 8)}</div></div></div></div>`)); syncGlow(); log('Output-shaped skeleton nodes placed on the canvas'); };
  const fillNode = i => { const n = $(`.ai-node[data-n="${i}"]`, flow); if (!n) return; const w = WF_AI[i]; setLayer(n, `<div style="display:flex;gap:10px;align-items:center"><span class="nt" style="width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:${w[3]};color:${w[4]}">${ic(w[2], 16)}</span><div><b>${w[0]}</b><span>${w[1]}</span></div></div>`, { fade: T.XF }); };
  const next = () => {
    if (phase !== 'working') return;
    step++;
    if (step === 2) addSkeletonNodes();
    if (step === 3) [0, 1, 2].forEach(i => s.after(i * 250, () => fillNode(i)));
    if (step >= STEPS.length) { phase = 'done'; secs = Math.max(1, Math.round((vnow() - t0) / 1000)); paint(); TL.end(op, 'done'); log(`Done · Built in ${secs}s`, 'good'); announce('Workflow generated'); return; }
    paint(); log(`Step: ${STEPS[step]}`); TL.set(op, 'words');
    if (!isFinite(stepMs)) return; // hangs / offline: stuck on "Choosing a trigger", timer keeps counting
    s.after(stepMs, next);
  };
  AI.wfStop = () => { if (phase !== 'working') return; phase = 'stopped'; paint(); TL.end(op, 'done'); log('Stopped by user'); };
  AI.wfUndo = () => { $$('.ai-node', flow).forEach(n => n.remove()); host.innerHTML = ''; log('Generated steps removed'); };
  AI.wfKeep = () => { host.innerHTML = ''; toast('Workflow updated', { icon: 'check' }); };
  paint(); log('Step ledger: Reading your form fields'); TL.set(op, 'indicator');
  if (S.net === 'fail') s.after(3000, () => { phase = 'failed'; paint(); TL.end(op, 'failed'); log("Failed → “Couldn't generate this workflow” + Try again", 'bad'); });
  else s.after(isFinite(stepMs) ? stepMs : 1800, next);
  s.after(120000, () => { if (phase === 'working') { phase = 'failed'; paint(); TL.end(op, 'failed'); } });
}

/* Center an element inside its own scroll area only — never scroll the page that embeds the prototype */
function scrollWithin(el) {
  let sc = el.parentElement;
  while (sc && !(sc.scrollHeight > sc.clientHeight && /auto|scroll/.test(getComputedStyle(sc).overflowY))) sc = sc.parentElement;
  if (!sc || sc === document.body || sc === document.documentElement) return;
  const r = el.getBoundingClientRect(), c = sc.getBoundingClientRect();
  sc.scrollTop += r.top - c.top - (sc.clientHeight - r.height) / 2;
}

function embedSettled() {
  const op = TL.op;
  if (!op || op.end == null || op.t0 < EMBED.runVt || Route.then) return null;
  if (op.state === 'failed') return 'failed';
  if ($('#app').querySelector('.layer[data-kind="skeleton"]:not(.leaving)')) return null;
  return 'done';
}
function embedCycle(wait) {
  const E = EMBED, g = ++E.gen;
  embedReset();
  if (!E.scenario) return;
  setTimeout(() => {
    if (g !== E.gen) return;
    try { embedRun(); } catch (e) { console.error(e); }
    if (!E.loop) return;
    const t0 = performance.now(), CAP = 45000;
    let key = null, since = 0;
    const iv = setInterval(() => {
      if (g !== E.gen) { clearInterval(iv); return; }
      let st = embedSettled();
      if (!st && performance.now() - t0 > CAP) st = 'cap';
      if (!st) { key = null; return; }
      if (key !== TL.op) { key = TL.op; since = performance.now(); return; }
      if (st !== 'cap' && performance.now() - since < 600) return;
      clearInterval(iv);
      const hold = st === 'failed' && isToday() ? 6000 : 0;
      setTimeout(() => { if (g === E.gen) embedCycle(true); }, hold + 2500);
    }, 150);
  }, wait ? E.delay : 0);
}
function embedInit() {
  const E = EMBED;
  document.documentElement.classList.add('embed');
  S.mode = E.mode; $('#app').classList.toggle('mode-today', isToday()); applyAccent();
  S.net = E.net; setScale(E.scale);
  if (E.accent) { S.accent = E.accent; applyAccent(); }
  S.tbl = { refresh: E.trefresh, filter: E.tfilter, bar: E.tbar, changed: E.tchanged }; S.btnLabel = E.btnlabel;
  S.imp = { type: E.itype, cancel: E.icancel, acts: E.iacts, pct: E.ipct, fail: E.ifail, retry: E.iretry, note: E.inote, wide: E.iwide };
  if (E.labels) { S.ann = true; $('#app').classList.add('annotate'); const c = $('#pm-ann'); if (c) c.checked = true; }
  if (E.tl) { S.tl = true; $('#app').classList.add('tl-on'); const c = $('#pm-tl'); if (c) c.checked = true; TL.paint(); }
  paintPanel();
  window.addEventListener('message', e => { const d = e && e.data; if (d && typeof d === 'object' && d.type === 'ld:replay') embedCycle(false); });
  embedCycle(true);
}

/* ---------- Init: Proposed · Typical · Launchpad, then auto-play one cold boot (embed: see above) ---------- */
(function init() {
  TL.init(); TL.paint(); renderPanel(); applyAccent();
  renderShell(false); setShellChrome(PAGES.launchpad);
  setLayer(region(), renderLaunchpad());
  requestAnimationFrame(t => { Clock.last = t; requestAnimationFrame(tick); });
  if (EMBED.on) { embedInit(); return; }
  logOp('Loading playground ready · Proposed · Typical 1.5 s');
  coldBoot();
})();
</script>
