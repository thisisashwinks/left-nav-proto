<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. TOKENS
   ===================================================================== */
:root{
  --ts:1;                         /* time scale (1, .5, 4) — every duration divides by this */
  --primary-600:#155eef;
  --primary-700:color-mix(in srgb,var(--primary-600) 82%,#000);
  --primary-50:color-mix(in srgb,var(--primary-600) 7%,#fff);
  --primary-100:color-mix(in srgb,var(--primary-600) 14%,#fff);
  --primary-200:color-mix(in srgb,var(--primary-600) 26%,#fff);
  --gray-25:#fcfcfd;--gray-50:#f9fafb;--gray-100:#f2f4f7;--gray-200:#eaecf0;--gray-300:#d0d5dd;
  --gray-400:#98a2b3;--gray-500:#667085;--gray-600:#475467;--gray-700:#344054;--gray-800:#1d2939;--gray-900:#101828;
  --ink:#101828;--line:#eaecf0;--row-line:#f2f4f7;--row-sel:#f5f8ff;
  --green-700:#027a48;--green-500:#12b76a;--green-50:#ecfdf3;--red-600:#d92d20;--red-50:#fef3f2;--red-500:#f04438;
  --ai:#9333ea;--ai-ink:#7e22ce;
  /* loading tokens (SPEC Part B) */
  --ld-grace:300ms;--ld-min-visible:400ms;--ld-fade-in:150ms;--ld-crossfade:200ms;
  --ld-words:2000ms;--ld-still:8000ms;--ld-cancel:2000ms;--ld-timeout:30000ms;--ld-boot-stall:10000ms;--ld-btn-success:1500ms;
  --ld-sk:#eaecf0;--ld-sk-page:#e4e7ec;--ld-glow:rgba(255,255,255,.6);
  --ease-arrive:cubic-bezier(.16,1,.3,1);
  --shadow-lg:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);
  --shadow-xl:0 20px 24px -4px rgba(16,24,40,.08),0 8px 8px -4px rgba(16,24,40,.03);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--gray-50);color:var(--ink);font:14px/20px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{display:flex;height:100vh;width:100vw;overflow:hidden}

/* =====================================================================
   2. SHELL — rail, nav, flyout, app bar, canvas
   ===================================================================== */
#app{position:relative;flex:1;min-width:0;height:100%;display:flex;background:var(--gray-50);overflow:hidden;container-type:inline-size;container-name:app}
@container app (max-width:1220px){.search-pill,.sk.sk-search{width:120px!important}.search-pill kbd{display:none}.ib.opt,.sk.opt{display:none}}
.rail{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:8px;position:relative}
.rail .agency{width:32px;height:32px;border-radius:50%;background:#e4e7ec;color:#475467;font-size:11px;font-weight:600;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #d0d5dd}
.rail .grip{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#667085;margin-top:6px}
.rail .grip:hover{background:var(--gray-100)}
.rail-accts{margin-top:150px;display:flex;flex-direction:column;align-items:center}
.acct{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;position:relative}
.acct i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:6.5px;font-weight:700;color:#fff;letter-spacing:-.2px}
.acct:hover i{transform:scale(1.15)}
.acct.on{background:#fff;box-shadow:inset 0 0 0 1px #eaecf0}
.acct.on i{width:28px;height:28px;font-size:10px;background:var(--primary-600)!important;transform:none}
.acct .tip{display:none}
.nav{width:264px;flex:none;display:flex;flex-direction:column;position:relative;padding:0 0 12px}
.nav-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 12px}
.nav-head b{font-size:14px;font-weight:600;color:#344054;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-head button{color:#667085;width:26px;height:26px;display:grid;place-items:center;border-radius:6px}
.lp-card{margin:2px 10px 6px;height:49px;border-radius:9px;box-shadow:inset 0 0 0 1px #eaecf0;padding:8px 10px 0;display:block;text-align:left;width:244px;background:transparent;position:relative}
.lp-card.on{background:#fff}
.lp-card .r1{display:flex;align-items:center;gap:8px}
.lp-card .r1 svg{color:var(--primary-600)}
.lp-card .r1 b{font-size:13px;font-weight:600;color:#344054;flex:1}
.lp-card .r1 span{font-size:12px;color:#667085}
.lp-card .bar{margin-top:9px;height:3px;border-radius:9px;background:var(--gray-200);overflow:hidden}
.lp-card .bar i{display:block;height:100%;width:57%;background:var(--primary-600);border-radius:9px}
.sec-label{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 4px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:#667085}
.sec-label a{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;display:flex;align-items:center;gap:2px;color:#667085}
.nrow{display:flex;align-items:center;gap:10px;margin:0 10px 2px;width:244px;height:36px;border-radius:7px;padding:0 8px;color:#344054;font-size:14px;text-align:left;position:relative}
.nrow svg{color:#667085}
.nrow:hover{background:var(--gray-100)}
.nrow.on{background:#fff;box-shadow:inset 0 0 0 1px #eaecf0;color:#101828;font-weight:500}
.nrow.on svg{color:#344054}
.nrow .pin{margin-left:auto;color:#98a2b3}
.nrow .pin svg{width:13px;height:13px;color:#98a2b3}
.ndiv{height:1px;background:#eaecf0;margin:6px 20px}
.flyout{position:absolute;top:0;bottom:0;left:320px;width:264px;background:var(--gray-50);box-shadow:inset 1px 0 0 #eaecf0,8px 0 24px -8px rgba(16,24,40,.12);z-index:30;padding:0;display:none}
.flyout.open{display:block;animation:fly-in calc(180ms / var(--ts)) var(--ease-arrive)}
@keyframes fly-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.flyout .fh{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;font-size:15px;font-weight:600;color:#344054}
.flyout .fh button{color:#667085;width:26px;height:26px;display:grid;place-items:center;border-radius:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.appbar{height:48px;flex:none;display:flex;align-items:center;padding:0 12px 0 6px;gap:12px;position:relative}
.crumb-slot{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.crumbs{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.crumbs .c{display:flex;align-items:center;gap:3px;color:#667085;padding:3px 4px;border-radius:6px}
.crumbs .c.leaf{color:#344054;font-weight:600}
.crumbs .c svg{width:12px;height:12px}
.crumbs .sep{color:#98a2b3}.crumbs .sep svg{width:12px;height:12px}
.bar-right{display:flex;align-items:center;gap:8px;flex:none}
.search-pill{width:196px;height:32px;border-radius:999px;box-shadow:inset 0 0 0 1px #d0d5dd;display:flex;align-items:center;gap:8px;padding:0 12px;color:#667085;font-size:13px;background:#fff0}
.search-pill kbd{margin-left:auto;font:500 11px var(--font);color:#344054}
.askai{height:32px;border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#f1e2ff,#eee7ff);color:#7e22ce;font-size:13px;font-weight:500}
.ib{width:26px;height:26px;display:grid;place-items:center;color:#667085;border-radius:6px;position:relative}
.ib:hover{background:var(--gray-100)}
.ib .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red-500);box-shadow:0 0 0 1.5px var(--gray-50)}
.me{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#a3684a,#3b2a20);flex:none}
.canvas-wrap{flex:1;min-height:0;padding-left:4px;display:flex}
.canvas{flex:1;min-width:0;background:#fff;border-top-left-radius:12px;box-shadow:var(--shadow-lg),inset 1px 1px 0 #f2f4f7;position:relative;overflow:hidden;container-type:inline-size;container-name:canvas}
#page-region{position:absolute;inset:0}
.page{padding:24px;min-height:100%}
/* full-bleed builder */
#app.full-bleed .rail,#app.full-bleed .nav{display:none}
#app.full-bleed .canvas-wrap{padding-left:0}
#app.full-bleed .canvas{border-radius:0;box-shadow:inset 0 1px 0 #eaecf0}
#app.full-bleed .appbar{background:#fff;padding:0 12px}

/* =====================================================================
   3. REGIONS + LAYERS (cross-fade by grid stacking)
   ===================================================================== */
.region{display:grid;position:relative;min-width:0;min-height:0}
.region>.layer{grid-area:1/1;min-width:0;min-height:0;position:relative}
#page-region{display:grid}
#page-region>.layer{overflow:auto}
.layer.fade-in{animation:ly-in calc(var(--fd,150ms) / var(--ts)) ease both}
.layer.fade-out{animation:ly-out calc(var(--fd,150ms) / var(--ts)) ease both;pointer-events:none}
.layer.leaving{pointer-events:none}
.layer.dim{opacity:.6;transition:opacity calc(150ms / var(--ts)) ease;pointer-events:none}
@keyframes ly-in{from{opacity:0}to{opacity:1}}
@keyframes ly-out{from{opacity:1}to{opacity:0}}
.layer.sk-layer{background:#fff}
#page-region>.layer[data-kind="skeleton"],#page-region>.layer[data-kind="failure"]{background:#fff}

/* =====================================================================
   4. SKELETON PRIMITIVES (Proposed: one look, one animation, shared phase)
   ===================================================================== */
.sk{display:block;background:var(--ld-sk);border-radius:4px;height:10px;position:relative;overflow:hidden;flex:none;
  animation:sk-in calc(400ms / var(--ts)) var(--ease-arrive) both;animation-delay:calc(min(var(--i,0),8) * 30ms / var(--ts))}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,var(--ld-glow) 50%,rgba(255,255,255,0) 100%);
  transform:translateX(-100%);animation:sk-glow calc(2200ms / var(--ts)) ease-in-out infinite}
.sk.h12{height:12px}.sk.h8{height:8px}.sk.h14{height:14px}.sk.h16{height:16px}.sk.h20{height:20px}
.sk.blk{border-radius:6px}.sk.pill,.sk.av{border-radius:999px}
.on-gray .sk{background:var(--ld-sk-page)}
@keyframes sk-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes sk-glow{0%{transform:translateX(-100%)}72.73%,100%{transform:translateX(100%)}}
.sk-still{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#667085;animation:ly-in calc(150ms / var(--ts)) both}
/* reduced motion: no translate, no glow; spinners still spin */
#app.rm .sk{animation:none}
#app.rm .sk::after{display:none}
#app.rm .flyout.open{animation:none}
/* TODAY: five different skeleton looks (S10) — none are phase-synced */
.v-today .sk::after{display:none}
.v-heavy .sk{background:#e4e7ec;border-radius:0;animation:t-pulse calc(2s / var(--ts)) cubic-bezier(.4,0,.6,1) infinite}
.v-pulse .sk{background:#e5e7eb;border-radius:6px;animation:t-pulse calc(2s / var(--ts)) cubic-bezier(.4,0,.6,1) infinite}
.v-wave .sk{background:linear-gradient(90deg,#efefef 25%,#dedede 37%,#efefef 63%);background-size:400% 100%;border-radius:2px;animation:t-wave calc(2s / var(--ts)) ease infinite}
.v-hr .sk{background:#eee;border-radius:3px;animation:t-hr calc(2s / var(--ts)) ease-in-out infinite}
.v-shell .sk{background:#f2f4f7;animation:sk-in calc(400ms / var(--ts)) var(--ease-arrive) both}
.v-shell .sk::after{display:block;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));animation:t-shellglow calc(2.4s / var(--ts)) ease-in-out calc(700ms / var(--ts)) infinite}
@keyframes t-pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes t-wave{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes t-hr{0%,100%{background:#f0f0f0}50%{background:#dcdcdc}}
@keyframes t-shellglow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* =====================================================================
   5. LOADER COMPONENTS
   ===================================================================== */
/* Spinner — one ring, 16/20/24/32, 0.8 s linear, currentColor */
.spinner{display:inline-block;flex:none;color:var(--primary-600);line-height:0}
.spinner svg{display:block;animation:spin calc(800ms / var(--ts)) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner.neutral{color:#667085}
/* Today: legacy spinners */
.hr-spin{width:34px;height:34px;border-radius:50%;border:3px solid transparent;border-top-color:#155eef;border-right-color:#155eef;animation:spin calc(3s / var(--ts)) linear infinite}
.v-spinner{width:50px;height:50px;border-radius:50%;border:4px solid #dbe4ff;border-top-color:#155eef;animation:spin calc(1s / var(--ts)) linear infinite}
.lds-ring{width:40px;height:40px;border-radius:50%;border:4px solid #155eef;border-color:#155eef transparent transparent transparent;animation:spin calc(1.2s / var(--ts)) cubic-bezier(.5,0,.5,1) infinite}
.center-fill{display:grid;place-items:center;min-height:100%;height:100%;padding:24px}
.center-fill .stack{display:flex;flex-direction:column;align-items:center;gap:12px;color:#667085;font-size:13px}
/* RouteProgressLine — single 2 px line under the header across the canvas */
.route-line{position:absolute;left:0;right:0;top:0;height:2px;z-index:40;pointer-events:none;opacity:0}
.route-line i{display:block;height:100%;width:100%;background:var(--primary-600);transform-origin:0 50%;transform:scaleX(0)}
.route-line.on{opacity:1}
.route-line.done i{transition:transform calc(200ms / var(--ts)) ease-out}
.route-line.fading{opacity:0;transition:opacity calc(200ms / var(--ts)) ease calc(200ms / var(--ts))}
/* Today: fake staged boot bar across the full window top */
.boot-bar{position:absolute;left:0;right:0;top:0;height:2px;z-index:200;pointer-events:none;display:none}
.boot-bar i{display:block;height:100%;background:#155eef;width:0;transition:width calc(500ms / var(--ts)) ease}
.boot-bar.on{display:block}
/* StatusWords — breadcrumb slot */
.status-words{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:#475467;white-space:nowrap;min-width:0;position:relative}
.status-words:empty{display:none}
.status-words .sw-in.wrap{white-space:normal;max-width:420px}
.status-words .sw-in{display:flex;align-items:center;gap:6px;animation:ly-in calc(150ms / var(--ts)) both;overflow:hidden;text-overflow:ellipsis}
.status-words a,.status-words button.link{color:var(--primary-600);font-weight:500;cursor:pointer}
.status-words svg.i{width:14px;height:14px;color:#667085}
/* Failure state */
.failure{display:grid;place-items:center;height:100%;min-height:220px;padding:24px;text-align:center}
.failure .fi{width:40px;height:40px;border-radius:50%;background:var(--gray-100);color:#475467;display:grid;place-items:center;margin:0 auto 12px}
.failure .fi svg{width:20px;height:20px}
.failure h3{margin:0;font-size:16px;line-height:24px;font-weight:600;color:#101828;outline:none}
.failure p{margin:4px 0 16px;font-size:13px;line-height:18px;color:#475467}
.failure .acts{display:flex;gap:8px;justify-content:center}
.failure.small{min-height:0;padding:12px}
.failure.small h3{font-size:14px;line-height:20px}
.failure.small .fi{width:32px;height:32px;margin-bottom:8px}
.failure.small .fi svg{width:16px;height:16px}
.failure.small p{margin:2px 0 10px}
/* Buttons */
.btn{height:34px;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;position:relative}
.btn.pri{background:var(--primary-600);color:#fff}
.btn.pri:hover{background:var(--primary-700)}
.btn.sec{background:#fff;box-shadow:inset 0 0 0 1px #d0d5dd;color:#344054;font-weight:500}
.btn.sec:hover{background:var(--gray-50)}
.btn.sm{height:32px;padding:0 12px}
.btn.xs{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{color:#344054;font-weight:500}
.btn.ghost:hover{background:var(--gray-100)}
.btn[aria-disabled="true"]{cursor:default}
.btn.pri[aria-disabled="true"]{background:var(--primary-600)}
.btn.ok{background:var(--green-700)!important}
.btn .bl-label{display:inline-flex;align-items:center;gap:6px}
.btn.pending .bl-label{visibility:hidden}
.btn .bl-spin{position:absolute;inset:0;display:grid;place-items:center}
.btn.pri .spinner{color:#fff}
.inline-err{display:flex;align-items:center;gap:6px;color:var(--red-600);font-size:13px;line-height:18px;margin-top:8px}
.inline-err svg{width:14px;height:14px}
/* RefreshState edge line */
.edge-line{position:absolute;left:0;right:0;top:0;height:2px;overflow:hidden;z-index:5;pointer-events:none;border-radius:12px 12px 0 0}
.edge-line i{position:absolute;top:0;bottom:0;width:35%;background:var(--primary-600);animation:edge calc(1.2s / var(--ts)) ease-in-out infinite}
@keyframes edge{0%{left:-35%}100%{left:100%}}
#app.rm .edge-line i{animation:none;left:0;width:100%;opacity:.6}
/* Table refresh variants: skeleton rows inserted at the top, fresh rows highlighted once */
table.t tr.sk-tr td{height:44px}
table.t tr.sk-tr.in{animation:tr-in calc(200ms / var(--ts)) var(--ease-arrive, ease-out) both}
@keyframes tr-in{from{opacity:0}to{opacity:1}}
#app.rm table.t tr.sk-tr.in{animation:none}
/* ButtonLoading with label: spinner + words, width grows smoothly */
.btn.busy-lbl .bl-label .spinner{flex:none}
/* ProgressBar */
.pbar{height:4px;border-radius:999px;background:#f2f4f7;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary-600);border-radius:999px;transition:width calc(300ms / var(--ts)) ease-out}
.pbar.lg{height:6px}
.pbar.ind{position:relative}
.pbar.ind i{position:absolute;top:0;bottom:0;width:35%;animation:edge calc(1.2s / var(--ts)) ease-in-out infinite}
.shell-in{animation:ly-in calc(200ms / var(--ts)) ease both}
.status-words .spinner{color:var(--primary-600)}
.pbar.done i{background:var(--green-500)}
.pbar.err i{background:var(--red-500)}
/* JobTray */
.jobtray{position:absolute;right:16px;bottom:16px;width:340px;z-index:120;background:#fff;border-radius:12px;box-shadow:var(--shadow-xl),0 0 0 1px #eaecf0;display:none;overflow:hidden}
.jobtray.on{display:block;animation:tray-in calc(250ms / var(--ts)) var(--ease-arrive)}
@keyframes tray-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.rm .jobtray.on{animation:ly-in calc(150ms / var(--ts))}
#app.tl-on .jobtray{bottom:52px}
.jt-head{position:relative;min-height:40px;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 14px;font-size:13px;font-weight:600;color:#101828;border-bottom:1px solid #f2f4f7;cursor:pointer}
.jt-head .jt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.jt-head .jt-t small{font-size:12px;line-height:16px;font-weight:400;color:#667085}
.jt-head .ib{width:24px;height:24px;flex:none}
.jt-head .jt-tog svg{transition:transform calc(150ms / var(--ts))}
.jobtray.collapsed .jt-tog svg{transform:rotate(180deg)}
.jt-head .ib[aria-disabled="true"]{color:#d0d5dd;cursor:not-allowed;background:transparent}
.jt-prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#f2f4f7;overflow:hidden}
.jt-prog i{display:block;height:100%;background:var(--primary-600);transition:width calc(250ms / var(--ts)) linear}
.jobtray.collapsed .jt-head{border-bottom:0}
.jobtray.collapsed .jt-body{display:none}
.jt-body{max-height:360px;overflow:auto}
.job .jbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.job .jbar .pbar{flex:1;margin-top:0}
.job .jx{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#667085;flex:none}
.job .jx:hover{background:#f2f4f7;color:#101828}
.job .jx svg{width:14px;height:14px}
/* Import file cards */
.jobtray.wide{width:440px}
.jobtray.wide .jt-t small,.jobtray.wide .jt-note{white-space:nowrap}
.jt-note{padding:8px 14px;font-size:12px;line-height:16px;color:#475467;background:#f9fafb;border-bottom:1px solid #f2f4f7}
.job.files{padding:6px 8px}
.fcard{display:flex;gap:12px;padding:10px 8px;border-radius:8px}
.fcard + .fcard{margin-top:2px}
.fcard .fic{width:32px;height:32px;border-radius:50%;background:var(--primary-50);color:var(--primary-600);display:grid;place-items:center;flex:none}
.fcard .fic svg{width:16px;height:16px}
.fcard .fb{flex:1;min-width:0}
.fcard .f1{display:flex;align-items:flex-start;gap:6px}
.fcard .f1 b{flex:1;min-width:0;font-size:13px;line-height:18px;font-weight:500;color:#344054;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fa{display:flex;gap:2px;margin:-2px -2px 0 0}
.fcard .fm{font-size:12px;line-height:16px;color:#667085;margin-top:2px}
.fcard .fbar{display:flex;align-items:center;gap:10px;margin-top:8px}
.fcard .fbar .pbar{flex:1;height:6px}
.fcard .fbar .pct{font-size:12px;color:#344054;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.fcard .pbar.paused i{background:#98a2b3}
.fcard .fok{width:20px;height:20px;border-radius:50%;background:var(--green-600,#079455);color:#fff;display:grid;place-items:center;flex:none}
.fcard .fok svg{width:12px;height:12px}
.fcard.ok .fic{background:var(--green-50);color:var(--green-700)}
.fcard.bad{background:#fef3f2}
.fcard.bad .fic{background:#fee4e2;color:var(--red-600)}
.fcard.bad .f1 b{color:var(--red-700,#b42318)}
.fcard.bad .fm{color:#344054}
.fcard.bad .jx{color:var(--red-600)}
.fcard .flink{margin-top:6px;font-size:13px;font-weight:600;color:var(--red-700,#b42318);padding:0}
.fcard .flink:hover{text-decoration:underline}
.fcard .fcx{margin-top:8px}
.fsum{font-size:12px;color:#475467;padding:4px 8px 6px}
.job{padding:12px 14px;border-bottom:1px solid #f2f4f7}
.job:last-child{border-bottom:0}
.job .j1{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#101828}
.job .j1 .ji{width:24px;height:24px;border-radius:6px;background:var(--primary-50);color:var(--primary-600);display:grid;place-items:center;flex:none}
.job .j1 .ji svg{width:14px;height:14px}
.job .j1 .ji.ok{background:var(--green-50);color:var(--green-700)}
.job .j1 .ji.err{background:var(--red-50);color:var(--red-600)}
.job .j1 small{margin-left:auto;font-weight:400;color:#667085;font-size:12px}
.job .jmeta{display:flex;justify-content:space-between;font-size:12px;line-height:18px;color:#475467;margin-top:6px}
.job .pbar{margin-top:8px}
.job .jnote{font-size:12px;color:#667085;margin-top:6px;line-height:16px}
.job .jacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* Toasts */
.toasts{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:150;pointer-events:none}
.toast{pointer-events:auto;background:#101828;color:#fff;font-size:13px;line-height:18px;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-xl);animation:toast-in calc(200ms / var(--ts)) var(--ease-arrive);max-width:520px}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast svg{width:16px;height:16px}
.toast.bad{background:#fff;color:#b42318;box-shadow:var(--shadow-xl),0 0 0 1px #fecdca}
.toast .sub{color:#d0d5dd}
/* AIStatus */
.ai-status{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;color:#475467;min-height:24px}
.ai-status .spark{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#a855f7,#3b1178);display:grid;place-items:center;color:#fff;flex:none}
.ai-status .spark svg{width:12px;height:12px}
.ai-status.thinking .spark{animation:t-pulse calc(1.6s / var(--ts)) ease-in-out infinite}
#app.rm .ai-status .spark{animation:none}
.ai-status b{color:#344054;font-weight:600}
.ai-status .tmr{color:#667085;font-variant-numeric:tabular-nums}
.ai-steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ai-steps li{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;color:#475467}
.ai-steps li .st{width:16px;height:16px;display:grid;place-items:center;flex:none}
.ai-steps li.done{color:#344054}
.ai-steps li.done .st{color:var(--green-700)}
.ai-steps li.wait{color:#98a2b3}
.ai-steps li.wait .st i{width:6px;height:6px;border-radius:50%;background:#d0d5dd}
.caret{display:inline-block;width:2px;height:14px;background:var(--ai);vertical-align:-2px;margin-left:1px;animation:t-pulse calc(1s / var(--ts)) steps(2) infinite}

/* Annotate */
#app.annotate [data-ann]{outline:1.5px dashed rgba(240,68,56,.85);outline-offset:-1px}
#app.annotate [data-ann]::before{content:attr(data-ann);position:absolute;z-index:500;top:2px;left:2px;background:#d92d20;color:#fff;font:600 10px/14px var(--font);padding:1px 5px;border-radius:4px;pointer-events:none;white-space:nowrap;letter-spacing:.1px;animation:none;transform:none;opacity:1}
#app.annotate .route-line[data-ann]::before{top:4px;left:auto;right:8px}
#app.annotate .status-words[data-ann]::before{top:-15px;left:0}
#app.annotate .btn[data-ann]::before{top:-17px;left:0}
#app.annotate .boot-bar[data-ann]::before{top:4px;left:50%}
#app.annotate .edge-line[data-ann]{overflow:visible}
#app.annotate .edge-line[data-ann]::before{top:4px;left:auto;right:8px}

/* Timeline strip */
.timeline{position:absolute;left:0;right:0;bottom:0;height:36px;z-index:160;background:rgba(16,24,40,.92);color:#e4e7ec;display:none;align-items:center;gap:12px;padding:0 14px;font-size:12px;backdrop-filter:blur(4px)}
#app.tl-on .timeline{display:flex}
.timeline .tl-op{width:190px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-weight:600}
.timeline .tl-clock{width:64px;flex:none;font-variant-numeric:tabular-nums;color:#fff;font-weight:600;text-align:right}
.timeline .tl-track{flex:1;position:relative;height:20px;min-width:200px;margin-right:8px}
.timeline .tl-rail{position:absolute;left:0;right:0;top:9px;height:2px;background:#475467;border-radius:2px}
.timeline .tl-fill{position:absolute;left:0;top:9px;height:2px;background:#84adff;border-radius:2px;width:0}
.timeline .tl-mk{position:absolute;top:2px;width:1px;height:16px;background:#667085}
.timeline .tl-mk.last span{left:auto;right:4px}
.timeline .tl-mk span{position:absolute;top:-1px;left:4px;font-size:10px;line-height:12px;color:#98a2b3;white-space:nowrap}
.timeline .tl-head{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(132,173,255,.35)}
.timeline .tl-state{flex:none;display:flex;gap:4px}
.timeline .tl-state span{padding:2px 7px;border-radius:999px;background:#344054;color:#98a2b3;font-size:11px;line-height:14px}
.timeline .tl-state span.on{background:#84adff;color:#101828;font-weight:600}
.timeline .tl-state span.on.bad{background:#fda29b}
.timeline .tl-state span.on.good{background:#75e0a7}

/* Modal + drawer */
.modal-host{position:absolute;inset:0;z-index:100;display:none}
.modal-host.on{display:grid;place-items:center;background:rgba(16,24,40,.45);animation:ly-in calc(150ms / var(--ts)) both}
.modal{width:520px;max-width:calc(100% - 32px);background:#fff;border-radius:8px;box-shadow:var(--shadow-xl);display:flex;flex-direction:column;max-height:calc(100% - 64px)}
.modal .mh{padding:12px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f2f4f7}
.modal .mh b{font-size:16px;font-weight:600}
.modal .mb{padding:16px;min-height:330px;overflow:auto}
.modal .mf{padding:12px 16px;display:flex;justify-content:flex-end;gap:12px;border-top:1px solid #f2f4f7}
.drawer{position:absolute;top:0;right:0;bottom:0;width:320px;background:#fff;box-shadow:-12px 0 24px -6px rgba(16,24,40,.12),-1px 0 0 #eaecf0;z-index:60;display:flex;flex-direction:column;animation:drawer-in calc(200ms / var(--ts)) var(--ease-arrive)}
@keyframes drawer-in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
#app.rm .drawer{animation:ly-in calc(150ms / var(--ts))}
.drawer .dh{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid #f2f4f7;flex:none}
.drawer .dh b{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .db{flex:1;overflow:auto;padding:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:#344054}
.inp{white-space:nowrap;overflow:hidden;height:40px;border-radius:8px;border:1px solid #eaecf0;padding:0 12px;display:flex;align-items:center;font-size:14px;color:#101828;background:#fff;width:100%}
.inp.ph{color:#98a2b3}
.inp.sel{justify-content:space-between;gap:8px}
.inp>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.inp.sel svg{color:#667085}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 8px;font-size:13px}
.kv dt{color:#667085}.kv dd{margin:0;color:#101828;font-weight:500}

/* =====================================================================
   6. PAGE STYLES
   ===================================================================== */
.ph-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.ph-title{display:flex;align-items:center;gap:8px;font-size:20px;line-height:28px;font-weight:600;color:#101828;margin:0}
.ph-sub{font-size:13px;color:#667085;margin-top:2px}
.ph-acts{display:flex;gap:8px;align-items:center;flex:none}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--gray-100);box-shadow:inset 0 0 0 1px #eaecf0;font-size:12px;font-weight:500;color:#344054}
.vtabs{display:flex;gap:20px;border-bottom:1px solid #eaecf0;margin-bottom:12px;overflow:hidden;white-space:nowrap}
.vtab{display:flex;align-items:center;gap:6px;height:36px;font-size:14px;color:#475467;position:relative;font-weight:500}
.vtab .n{font-size:12px;padding:0 6px;border-radius:999px;background:var(--gray-100);color:#475467;line-height:18px}
.vtab.on{color:var(--primary-600)}
.vtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary-600);border-radius:2px}
.vtab.on .n{background:var(--primary-50);color:var(--primary-600)}
.vtab.add{color:#667085;font-weight:400}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:nowrap}
.tb-btn{height:34px;border-radius:8px;box-shadow:inset 0 0 0 1px #d0d5dd;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#344054;background:#fff;white-space:nowrap}
.tb-btn svg{width:14px;height:14px;color:#667085}
.tb-search{height:34px;border-radius:8px;box-shadow:inset 0 0 0 1px #d0d5dd;padding:0 12px;display:flex;align-items:center;gap:8px;width:260px;color:#98a2b3;font-size:13px;min-width:120px;flex-shrink:1}
.tb-search svg{width:14px;height:14px}
.tb-spacer{flex:1}
.updated{font-size:12px;color:#667085;white-space:nowrap}
.card{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #eaecf0;position:relative}
/* table */
.tbl-card{overflow:hidden}
.tbl-scroll{overflow:auto}
table.t{border-collapse:collapse;width:100%;min-width:1028px;font-size:13px}
table.t th{height:44px;text-align:left;font-weight:500;color:#475467;font-size:12px;background:var(--gray-25);border-bottom:1px solid #eaecf0;padding:0 12px;white-space:nowrap}
table.t td{height:44px;border-bottom:1px solid #f2f4f7;padding:0 12px;white-space:nowrap;color:#475467}
table.t tr:last-child td{border-bottom:0}
table.t td.cb,table.t th.cb{width:52px;padding-left:18px}
.cbx{flex:none;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px #d0d5dd;background:#fff;display:inline-block;vertical-align:middle}
.nm{display:flex;align-items:center;gap:8px}
.nm .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.nm b{font-weight:500;color:#101828;font-size:13.5px}
.nm span{color:#667085;font-size:12px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.status i{width:6px;height:6px;border-radius:50%}
.status.sub{color:#027a48}.status.sub i{background:#12b76a}
.status.inq{color:#004eeb}.status.inq i{background:#2e90fa}
.status.live{color:#027a48}.status.live i{background:#12b76a}
.status.rev{color:#b54708}.status.rev i{background:#f79009}
.status.draft{color:#475467}.status.draft i{background:#98a2b3}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;font-size:12px;color:#475467;border-top:1px solid #eaecf0}
.tbl-foot .pg{display:flex;gap:16px;align-items:center}
.tone-blue{background:#eff4ff;color:#004eeb}.tone-pink{background:#fdf2fa;color:#dd2590}.tone-green{background:#ecfdf3;color:#039855}
.tone-orange{background:#fef6ee;color:#e04f16}.tone-purple{background:#f4f3ff;color:#6938ef}.tone-yellow{background:#fffaeb;color:#dc6803}.tone-teal{background:#f0fdf9;color:#0e9384}
/* launchpad */
.lp{display:grid;grid-template-columns:230px 1fr;gap:24px;padding:24px 24px 24px 24px}
.lp-side h3{font-size:17px;font-weight:600;margin:6px 10px 12px}
.lp-tab{display:flex;align-items:center;gap:10px;height:38px;border-radius:8px;padding:0 10px;font-size:14px;color:#344054;width:100%;text-align:left}
.lp-tab.on{background:var(--primary-50);color:var(--primary-600);font-weight:500}
.lp-main h2{font-size:17px;line-height:24px;font-weight:600;margin:4px 0 14px}
.lp-pl{font-size:13px;color:#475467;margin-bottom:8px}
.lp-prog{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.lp-prog .pbar{flex:1;height:8px}
.lp-prog b{font-size:14px;font-weight:600}
.acc{border-radius:10px;box-shadow:0 0 0 1px #eaecf0;overflow:hidden;margin-bottom:20px}
.acc-row{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid #eaecf0;align-items:flex-start}
.acc-row:last-child{border-bottom:0}
.acc-row>svg{color:#667085;margin-top:2px;width:18px;height:18px}
.acc-row .tx{flex:1;min-width:0}
.acc-row .tx b{display:block;font-size:14px;font-weight:600;color:#101828}
.acc-row .tx span{display:block;font-size:13px;color:#475467;margin-top:2px}
.acc-row .pct{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#475467;flex:none}
.acc-row .pct.done{color:#039855}
.acc-row .chev{color:#667085;flex:none}
.acc-row.open{background:var(--gray-25)}
.tut{margin-top:12px}
.tut b{font-size:13px!important;margin-bottom:8px}
.tut .thumb{width:168px;height:92px;border-radius:8px;background:linear-gradient(135deg,#3b1178,#7a5af8 55%,#ee46bc);color:#fff;font-size:12px;font-weight:600;padding:10px;position:relative}
.tut .thumb .play{position:absolute;left:10px;bottom:10px;width:22px;height:22px;border-radius:50%;background:#101828;display:grid;place-items:center}
.tut .thumb .play svg{width:10px;height:10px;fill:#fff}
.lp h4{font-size:15px;font-weight:600;margin:4px 0 10px}
/* conversations */
.conv{display:flex;gap:10px;height:100%;padding:12px 12px 12px 12px;min-height:560px}
.conv-main{flex:1;min-width:0;display:grid;grid-template-columns:44px 280px minmax(0,1fr);border-radius:12px;box-shadow:inset 0 0 0 1px #e5e7eb;overflow:hidden}
.conv-strip{border-right:1px solid #e5e7eb;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px;color:#667085}
.conv-strip .ib.on{background:var(--primary-50);color:var(--primary-600)}
.conv-list{border-right:1px solid #e5e7eb;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cl-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.cl-head b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px}
.cl-tabs{display:flex;gap:14px;padding:0 14px;border-bottom:1px solid #eaecf0;font-size:13px;color:#475467}

.cl-tabs .n{font-size:11px;background:var(--primary-50);color:var(--primary-600);padding:0 5px;border-radius:999px;line-height:16px}
.cl-sel{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:#667085}
.cl-rows{overflow:auto;flex:1}
.cl-row{display:flex;gap:10px;padding:10px 14px;height:57px;align-items:flex-start;border-bottom:1px solid #f2f4f7;cursor:default}
.cl-row.on{background:var(--row-sel)}
.cl-row .av{width:32px;height:32px;border-radius:50%;background:#f2f4f7;color:#475467;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none;position:relative}
.cl-row .av em{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;display:grid;place-items:center;font-style:normal}
.ch-whatsapp{background:#25d366}.ch-sms{background:#2e90fa}.ch-email{background:#f79009}
.cl-row .tx{flex:1;min-width:0}
.cl-row .tx b{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#101828;white-space:nowrap}
.cl-row .tx b span{overflow:hidden;text-overflow:ellipsis}
.cl-row .tx b small{font-weight:400;color:#667085;font-size:11px;margin-left:6px}
.cl-row .tx p{margin:2px 0 0;font-size:12.5px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
.cl-row .tx p .u{flex:none;min-width:16px;height:16px;border-radius:999px;background:var(--primary-600);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.th-head{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #eaecf0;flex:none}
.th-head .av{width:32px;height:32px;border-radius:50%;background:#f2f4f7;display:grid;place-items:center;font-size:11px;font-weight:600;color:#475467}
.th-head b{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-body{flex:1;overflow:auto;padding:14px;min-height:0}
.th-new{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;color:var(--red-600);margin-bottom:12px}
.th-new::before,.th-new::after{content:"";flex:1;height:1px;background:#fecdca}
.msg{border-radius:10px;box-shadow:inset 0 0 0 1px #eaecf0;padding:12px 14px;margin-bottom:10px;font-size:13px;color:#344054;background:#fff}
.msg h5{margin:0 0 6px;font-size:13.5px;font-weight:600;color:#101828;display:flex;justify-content:space-between;gap:8px}
.msg h5 small{font-weight:400;color:#667085;font-size:12px;white-space:nowrap}
.msg p{margin:0 0 6px;line-height:19px}
.msg .loading-txt{color:#98a2b3;font-size:12px}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.qr span{height:28px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--primary-200);color:var(--primary-600);font-size:12px;font-weight:500;padding:0 10px;display:inline-flex;align-items:center;background:var(--primary-50)}
.msg-foot{font-size:11px;color:#667085;text-align:right;margin-bottom:6px}
.composer{border-top:1px solid #eaecf0;padding:10px 12px;flex:none}
.composer .cbox{border-radius:10px;box-shadow:inset 0 0 0 1px #d0d5dd;padding:8px 10px}
.composer .crow{display:flex;align-items:center;gap:8px;font-size:12px;color:#475467}
.composer .pillch{height:24px;border-radius:6px;box-shadow:inset 0 0 0 1px #eaecf0;padding:0 8px;display:inline-flex;align-items:center;gap:4px;font-weight:500;color:#344054}
.composer .ta{min-height:34px;font-size:13px;color:#98a2b3;padding:8px 0}
.composer .tools{display:flex;align-items:center;gap:6px;color:#667085}

.seg{display:flex;background:var(--gray-100);border-radius:8px;padding:2px;margin-bottom:12px}

@container canvas (max-width:980px){.conv-strip{display:none}.conv-main{grid-template-columns:260px minmax(0,1fr)}}

/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px;align-items:flex-start}
.kcol{width:282px;flex:none;display:flex;flex-direction:column;gap:8px}
.khead{border-radius:8px;box-shadow:inset 0 0 0 1px #eaecf0;padding:10px 12px;background:#fff}

.kcard{border-radius:8px;box-shadow:inset 0 0 0 1px #eaecf0,0 1px 2px rgba(16,24,40,.05);padding:12px;background:#fff;cursor:pointer;text-align:left;width:100%;display:block}

.kcard .k1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.kcard .own{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;white-space:nowrap}
.kcard dl{margin:8px 0 0;font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 6px}

.kcard .kic{display:flex;gap:10px;margin-top:10px;color:#98a2b3;align-items:center;font-size:11px}
.kcard .kic span{display:inline-flex;align-items:center;gap:3px}
.kcard .kic svg{width:13px;height:13px}
.kcard .appt{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--primary-50);color:var(--primary-600)}

.kcard .stale{display:inline-block;margin-top:8px;font-size:11px;font-weight:500;color:#b54708;background:#fffaeb;padding:1px 7px;border-radius:999px}
.pipe-dd{height:34px;border-radius:8px;box-shadow:inset 0 0 0 1px #d0d5dd;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#344054}
.seg2{display:inline-flex;border-radius:8px;box-shadow:inset 0 0 0 1px #d0d5dd;overflow:hidden}
.seg2 span{width:34px;height:34px;display:grid;place-items:center;color:#667085}
.seg2 span.on{background:var(--gray-100);color:#344054}
/* calendar */
.cal-tb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:nowrap}
.cal-tb b{font-size:15px;font-weight:600;margin:0 6px;white-space:nowrap}
.cal{border-radius:12px;box-shadow:0 0 0 1px #eaecf0;overflow:hidden}
.cal-g{display:grid;grid-template-columns:64px repeat(7,minmax(84px,1fr))}
.cal-dh{height:56px;border-bottom:1px solid #eaecf0;border-left:1px solid #eaecf0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-dh b{font-size:18px;font-weight:600;line-height:22px}
.cal-dh span{font-size:11px;font-weight:600;color:#667085;letter-spacing:.4px}
.cal-dh.sun b,.cal-dh.sun span{color:#e31b54}
.cal-gut{font-size:10px;color:#667085;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;border-bottom:1px solid #eaecf0}
.cal-ad{height:28px;border-bottom:1px solid #eaecf0;position:relative;grid-column:2/9}
.cal-ad .ev{position:absolute;top:4px;height:20px;left:calc(200% / 7 + 2px);width:calc(200% / 7 - 4px);border-radius:4px;background:var(--primary-600);color:#fff;font-size:11px;font-weight:600;padding:0 8px;line-height:20px}
.cal-body{display:grid;grid-template-columns:64px repeat(7,minmax(84px,1fr));position:relative}
.cal-hours div{height:48px;font-size:10.5px;color:#667085;text-align:right;padding-right:8px;transform:translateY(-6px)}
.cal-day{border-left:1px solid #eaecf0;position:relative;background-image:repeating-linear-gradient(#eaecf0 0 1px,transparent 1px 48px);height:480px}
.cal-ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 6px;font-size:11px;line-height:14px;overflow:hidden;border-left:3px solid}
.cal-ev b{display:block;font-weight:600}
.cal-ev.brand{background:var(--primary-50);color:var(--primary-700);border-color:var(--primary-600)}
.cal-ev.green{background:#ecfdf3;color:#05603a;border-color:#12b76a}
.cal-ev.purple{background:#f4f3ff;color:#5925dc;border-color:#7a5af8}
.cal-ev.orange{background:#fef6ee;color:#b93815;border-color:#ef6820}
.cal-ev.blocked{background:repeating-linear-gradient(135deg,#f2f4f7 0 6px,#fff 6px 12px);color:#475467;border-color:#98a2b3}
.cal-now{position:absolute;left:64px;right:0;height:0;border-top:2px solid #f04438;z-index:2}
.cal-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#f04438}
/* dashboard */
.dash-filters{display:flex;gap:8px;padding:10px;border-radius:12px;box-shadow:0 0 0 1px #eaecf0;margin-bottom:16px;flex-wrap:wrap}
.dash-h3{font-size:15px;font-weight:600;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.wcard{background:#fff;border-radius:12px;border:1px solid #eaecf0;padding:16px;min-height:120px}
.wcard>.layer{min-height:0}
.wcard h4{margin:0;font-size:14px;font-weight:600;color:#101828}
.wcard .wsub{font-size:12px;color:#667085;margin-top:2px}
.kpi .kv1{font-size:24px;line-height:32px;font-weight:600;margin-top:6px}
.kpi .delta{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;color:#667085;margin-top:2px}
.kpi .delta b{color:#027a48;font-weight:600}
.kpi .delta b.dn{color:#027a48}
.kpi svg.spark{width:100%;height:28px;margin-top:6px;display:block}
.dash-row{display:grid;gap:12px;margin-bottom:12px}
.dash-row.r2{grid-template-columns:2fr 1fr}
.dash-row.r3{grid-template-columns:1fr 1fr 1fr}
.wcard .chart{margin-top:12px}
.legend{display:flex;gap:12px;font-size:12px;color:#475467;flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;font-size:12px;color:#475467;margin-top:10px}
.hbar .tr{height:8px;border-radius:999px;background:#f2f4f7;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:#2970ff;border-radius:999px}
.hbar b{font-weight:600;color:#344054;text-align:right}
.sla-big{font-size:34px;line-height:40px;font-weight:600;margin-top:12px}
.partial{display:flex;align-items:center;gap:10px;border-radius:10px;background:#fffaeb;box-shadow:inset 0 0 0 1px #fedf89;padding:8px 12px;font-size:13px;color:#93370d;margin-bottom:12px;position:relative}
.partial b{font-weight:600}
.partial .btn{margin-left:auto}
@container canvas (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-row.r3{grid-template-columns:1fr 1fr}}
/* settings */
.set-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.set-card{border-radius:12px;box-shadow:0 0 0 1px #eaecf0;padding:16px}
.set-card h3{margin:0 0 2px;font-size:16px;font-weight:600}
.set-card .s{font-size:12px;color:#667085;margin-bottom:14px}
.upload{width:220px;height:138px;border-radius:8px;border:1.5px dashed #d0d5dd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:11.5px;color:#667085;padding:12px;margin-bottom:14px}
.upload svg{width:20px;height:20px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.set-foot{display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;margin-top:6px;flex-direction:column;align-items:flex-end}
@container canvas (max-width:700px){.set-grid{grid-template-columns:1fr}}
/* workflows + builder */
.folder{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#475467}
.folder svg{width:13px;height:13px;color:#98a2b3}
tr.click{cursor:pointer}tr.click:hover td{background:var(--gray-25)}
.bld{position:relative;height:100%;min-height:520px;background:#f9fafb;background-image:radial-gradient(rgba(208,213,221,.7) 1px,transparent 1px);background-size:18px 18px;overflow:hidden}
.bld-tabs{position:absolute;top:0;left:0;right:0;height:44px;background:#fff;border-bottom:1px solid #eaecf0;display:flex;justify-content:center;gap:22px;font-size:13px;color:#475467;z-index:2}
.bld-tabs span{display:flex;align-items:center;gap:6px;position:relative;font-weight:500}
.bld-tabs span.on{color:var(--primary-600)}
.bld-tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary-600)}
.bld-flow{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:640px}
.trig-row{display:flex;gap:16px}
.node{width:302px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #eaecf0,0 1px 2px rgba(16,24,40,.05);padding:12px;display:flex;gap:10px;align-items:center;position:relative}
.node .nt{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.node b{display:block;font-size:13px;font-weight:600}
.node span{display:block;font-size:12px;color:#667085}
.node.dash{background:transparent;box-shadow:none;border:1.5px dashed #d0d5dd;justify-content:center;color:#475467;font-weight:500;font-size:13px}
.conn{width:2px;height:28px;background:#d0d5dd;position:relative}
.conn-plus{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #d0d5dd;display:grid;place-items:center;color:#667085}
.conn-plus svg{width:12px;height:12px}
.end{font-size:11px;font-weight:600;color:#475467;background:#fff;box-shadow:inset 0 0 0 1px #d0d5dd;border-radius:999px;padding:3px 12px}
.zoom{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 0 0 1px #eaecf0,0 1px 2px rgba(16,24,40,.05);z-index:2}
.zoom span{width:32px;height:32px;display:grid;place-items:center;color:#475467;border-bottom:1px solid #f2f4f7}
.zoom span:last-child{border-bottom:0}
.ledger{position:absolute;top:60px;right:16px;width:300px;background:#fff;border-radius:10px;box-shadow:var(--shadow-xl),0 0 0 1px #eaecf0;padding:12px 14px;z-index:3}
.ledger .lh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-gen-btn{position:absolute;top:56px;right:16px;z-index:2}
.bbar{display:flex;align-items:center;gap:10px;width:100%}
.bbar .bname{font-size:14px;font-weight:600;white-space:nowrap}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#027a48;background:#ecfdf3;padding:2px 8px;border-radius:999px}
.live-pill i{width:6px;height:6px;border-radius:50%;background:#12b76a}
.saved-chip{font-size:12px;color:#475467;background:var(--gray-100);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
.toggle2{display:inline-flex;background:var(--gray-100);border-radius:8px;padding:2px;font-size:12px;font-weight:500}
.toggle2 span{padding:4px 10px;border-radius:6px;color:#475467}
.toggle2 span.on{background:#fff;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.08)}
/* skeleton shapes helpers */
.skr{display:flex;align-items:center;gap:10px}
.skc{display:flex;flex-direction:column;gap:8px}
.sk-rows .skrow{overflow:hidden;display:flex;align-items:center;gap:16px;height:44px;border-bottom:1px solid #f2f4f7;padding:0 12px 0 18px}
.sk-rows .skrow:last-child{border-bottom:0}
.sk-chart{position:relative;height:100%;min-height:120px;border-left:1px solid #eaecf0;border-bottom:1px solid #eaecf0;background-image:repeating-linear-gradient(to top,transparent 0 29px,#f2f4f7 29px 30px)}
.sk-bars{display:flex;align-items:flex-end;gap:10px;height:100%;padding:0 10px}
.sk-bars .sk{flex:1;border-radius:4px 4px 0 0}

/* =====================================================================
   7. CONTROL PANEL
   ===================================================================== */
#panel{width:320px;flex:none;height:100%;background:#fff;border-left:1px solid #eaecf0;display:flex;flex-direction:column;position:relative;z-index:300;font-size:13px;transition:width 200ms ease}
#panel.collapsed{width:36px}
#panel .p-head{min-height:48px;padding-top:10px!important;padding-bottom:10px!important;display:flex;align-items:flex-start;justify-content:space-between;padding:0 8px 0 16px;border-bottom:1px solid #eaecf0;flex:none}
#panel .p-head b{font-size:15px;font-weight:600}
#panel .p-head small{display:block;font-size:11px;color:#667085;font-weight:400;line-height:14px}
#panel .p-body{flex:1;overflow:auto;padding:4px 16px 12px;min-height:0}
#panel .p-tab{display:none;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:13px;color:#344054;padding:16px 0;width:36px;align-items:center;justify-content:center;gap:8px;height:100%}
#panel.collapsed .p-head,#panel.collapsed .p-body{display:none}
#panel.collapsed .p-tab{display:flex}
.p-sec{padding:12px 0;border-bottom:1px solid #f2f4f7}
.p-sec:last-child{border-bottom:0}
.p-lbl{font-size:12px;font-weight:600;color:#344054;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.p-lbl span{font-weight:400;color:#667085}
.segp{display:flex;background:var(--gray-100);border-radius:8px;padding:2px;gap:2px}
.segp button{flex:1;height:28px;border-radius:6px;font-size:12.5px;font-weight:500;color:#475467}
.segp button.on{background:#fff;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.1)}
.segp.mode button.on[data-v="today"]{color:#b54708}
.netgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.netgrid button{height:30px;border-radius:6px;box-shadow:inset 0 0 0 1px #eaecf0;font-size:12px;color:#344054;text-align:left;padding:0 8px;display:flex;justify-content:space-between;align-items:center}
.netgrid button small{color:#98a2b3;font-size:11px}
.netgrid button.on{box-shadow:inset 0 0 0 1.5px #101828;background:var(--gray-50);font-weight:600}
.scen{display:flex;flex-direction:column;gap:4px}
.scen button.sc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:7px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px #eaecf0;width:100%}
.scen button.sc[hidden]{display:none}
.sc-opts{display:flex;flex-direction:column;gap:4px;margin:-2px 0 4px;padding:8px 10px 6px;border-radius:8px;background:var(--gray-50,#f9fafb);box-shadow:inset 0 0 0 1px #eaecf0}
.sc-opts .segp button{font-size:12px}
.sc-opts .tgl{height:26px;font-size:12px}
.sc-opts.off{opacity:.45}
.sc-opts .p-sub{margin:4px 0 0}
.sc-opts .segp.dim{opacity:.45}
.scen button.sc:hover{background:var(--gray-50)}
.scen button.sc b{font-size:12.5px;font-weight:600;color:#101828}
.scen button.sc span{font-size:11.5px;color:#667085;line-height:15px}
.scen .route-pick{display:flex;gap:4px;align-items:center}
.scen .route-pick select{flex:1;height:30px;border-radius:6px;border:1px solid #eaecf0;font-size:12px;padding:0 6px;background:#fff}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px rgba(16,24,40,.1)}
.swatches button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #101828}
.swatches button.unk{width:auto;border-radius:999px;padding:0 10px 0 6px;display:flex;align-items:center;gap:6px;font-size:12px;color:#344054;box-shadow:inset 0 0 0 1px #eaecf0}
.swatches button.unk i{width:16px;height:16px;border-radius:50%;background:#98a2b3}
.swatches button.unk.on{box-shadow:inset 0 0 0 1.5px #101828}
.tgl{display:flex;align-items:center;justify-content:space-between;height:30px;cursor:pointer;font-size:12.5px;color:#344054}
.tgl input{display:none}
.tgl .sw{width:30px;height:18px;border-radius:999px;background:#d0d5dd;position:relative;transition:background 150ms}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left 150ms}
.tgl input:checked+.sw{background:#101828}
.tgl input:checked+.sw::after{left:14px}
.p-hint{font-size:11.5px;color:#667085;line-height:15px;margin-top:6px}
.p-sub{font-size:11.5px;color:#475467;margin:10px 0 4px}
.p-sec.off .p-opts{opacity:.45;pointer-events:none}
/* Page tab bar (shared with handoff.html + slides.html) */
#panel .p-head{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:10px}
#panel .p-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ld-tabs{display:inline-flex;align-items:center;border:1px solid #eaecf0;border-radius:8px;background:#f2f4f7;padding:2px;gap:2px;flex:none}
.ld-tabs a{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:6px;font:500 13px/18px var(--font);color:#475467;text-decoration:none;white-space:nowrap}
.ld-tabs a:hover{color:#101828}
.ld-tabs a[aria-current="page"]{background:#fff;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.ld-tabs a:focus-visible{outline:2px solid var(--primary-600);outline-offset:1px}

/* =====================================================================
   8. EMBED MODE (?embed=1) — no panel, app fills the frame
   ===================================================================== */
html.embed #panel{display:none!important}
</style>
</head>
<body>
<div id="root">
  <div id="app" class="mode-proposed">
    <div class="boot-bar" id="boot-bar"><i></i></div>
    <aside class="rail" id="rail"></aside>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="flyout" id="flyout"></div>
    <div class="main">
      <header class="appbar" id="appbar">

  const r = (size - sw) / 2, c = 2 * Math.PI * r, arc = c * 0.25;
  return `<span class="spinner ${cls}" role="presentation"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="${sw}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${arc.toFixed(2)} ${(c - arc).toFixed(2)}"/></svg></span>`;
}

/* =====================================================================
   JS 2. VIRTUAL CLOCK (time scale), SCOPES, NETWORK SIMULATION
   ===================================================================== */
const Clock = { vt: 0, scale: 1, last: performance.now(), timers: [], seq: 0, frames: new Set() };
const vnow = () => Clock.vt;
function after(ms, fn) { const id = ++Clock.seq; Clock.timers.push({ id, at: Clock.vt + Math.max(0, ms), fn }); return id; }
function cancelTimer(id) { const i = Clock.timers.findIndex(t => t.id === id); if (i >= 0) Clock.timers.splice(i, 1); }
function onFrame(fn) { Clock.frames.add(fn); return () => Clock.frames.delete(fn); }
function tick(now) {
  const dt = Math.min(250, now - Clock.last); Clock.last = now; Clock.vt += dt * Clock.scale;
  for (let guard = 0; guard < 200; guard++) {
    let due = null;
    for (const t of Clock.timers) if (t.at <= Clock.vt && (!due || t.at < due.at)) due = t;
    if (!due) break;
    Clock.timers.splice(Clock.timers.indexOf(due), 1);
    try { due.fn(); } catch (e) { console.error(e); }
  }
  Clock.frames.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  requestAnimationFrame(tick);
}
/* A Scope groups timers + requests; dispose() cancels everything it owns. */
class Scope {
  constructor(parent) { this.ids = []; this.dead = false; this.kids = []; this.cleanups = []; if (parent) parent.kids.push(this); }
  after(ms, fn) { const id = after(ms, () => { if (!this.dead) fn(); }); this.ids.push(id); return id; }
  every(ms, fn) { const loop = () => { if (this.dead) return; fn(); this.after(ms, loop); }; this.after(ms, loop); }
  frame(fn) { this.cleanups.push(onFrame(() => { if (!this.dead) fn(); })); }
  onDispose(fn) { this.cleanups.push(fn); }
  dispose() { if (this.dead) return; this.dead = true; this.ids.forEach(cancelTimer); this.kids.forEach(k => k.dispose()); this.cleanups.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
}
const ROOT = { scope: new Scope() };
function resetRootScope() { ROOT.scope.dispose(); ROOT.scope = new Scope(); return ROOT.scope; }

const NETS = {
  instant: { label: 'Instant', hint: '150 ms', lat: 150 }, fast: { label: 'Fast', hint: '0.6 s', lat: 600 },
  typical: { label: 'Typical', hint: '1.5 s', lat: 1500 }, slow: { label: 'Slow', hint: '5 s', lat: 5000 },
  vslow: { label: 'Very slow', hint: '12 s', lat: 12000 }, hang: { label: 'Hangs', hint: 'never', lat: Infinity },
  fail: { label: 'Fails', hint: 'error 3 s', lat: 3000, fail: true },
  q250: { label: '250 ms', hint: '250 ms', lat: 250, hidden: true }, q350: { label: '350 ms', hint: '350 ms', lat: 350, hidden: true }, offline: { label: 'Offline', hint: 'no network', offline: true },
};
const S = { mode: 'proposed', net: 'typical', page: 'launchpad', acct: 0, accent: '#155eef', unknown: false, rm: false, tl: false, ann: false, visited: new Set(), booted: false, bell: false,
  tbl: { refresh: 'rows', filter: 'skeleton', bar: false, changed: true }, btnLabel: true,
  imp: { type: 'multi', cancel: 'x', acts: true, pct: true, fail: true, retry: 'inline', note: 'below', wide: false } };
const Net = {
  waiting: [],
  get offline() { return S.net === 'offline'; },
  /* Simulated request. opts: factor (latency multiplier), forceOk, failThis (default true), baseNet (override) */
  request(scope, opts, ok, err) {
    const n = NETS[opts.net || S.net];
    if (n.offline) { this.waiting.push({ scope, opts, ok, err }); return; }
    const factor = opts.factor ?? 1;
    if (n.fail && !opts.forceOk && opts.failThis !== false) { scope.after(n.lat, () => err({ kind: 'fail' })); return; }
    const lat = n.fail ? NETS.typical.lat * factor : n.lat * factor;
    if (!isFinite(lat)) return; // hangs forever
    scope.after(lat, () => ok({}));
  },
  latency(opts = {}) { const n = NETS[S.net]; if (n.offline) return Infinity; if (n.fail) return NETS.typical.lat * (opts.factor ?? 1); return n.lat * (opts.factor ?? 1); },
  flushWaiting() { const w = this.waiting; this.waiting = []; w.forEach(r => { if (!r.scope.dead) this.request(r.scope, r.opts, r.ok, r.err); }); },
};
